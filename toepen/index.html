<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6b4a">
<meta name="description" content="Toepen: speel alleen, met vrienden, of houd de score bij.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Toepen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
  :root {
    --bg: #eef1ea; --surface: #fbfcf8; --fg: #1d2620; --muted: #5f6b62; --line: #d5dbd0;
    --accent: #1f6b4a; --accent-fg: #ffffff; --accent-soft: #dcebe2;
    --warn: #b4540f; --warn-soft: #fbe7d6; --danger: #b3261e; --danger-soft: #f9dedc; --scrim: rgba(18, 26, 21, 0.5);
    --font-display: "Bricolage Grotesque", "Arial Rounded MT Bold", system-ui, sans-serif;
    --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121a15; --surface: #1b251f; --fg: #e8eee8; --muted: #9eaba1; --line: #2c3a31;
      --accent: #4fbf89; --accent-fg: #0d1a13; --accent-soft: #1f3a2b;
      --warn: #f0a160; --warn-soft: #3a2817; --danger: #f2b8b5; --danger-soft: #4a1f1c; --scrim: rgba(0, 0, 0, 0.65);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.4; -webkit-tap-highlight-color: transparent; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 14px 16px 24px; min-height: calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); min-height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; }
  .down { margin-top: auto; } /* choices sit at the bottom: in reach of the thumb */
  h1, h2 { font-family: var(--font-display); margin: 0; letter-spacing: -0.01em; }
  h1 { font-size: 1.9rem; font-weight: 800; } h2 { font-size: 1.25rem; font-weight: 700; }
  p { margin: 0; } button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; text-align: left; }
  button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .muted { color: var(--muted); } .small { font-size: 0.875rem; }
  .label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; }
  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 18px; border-radius: 12px; font-weight: 700; background: var(--accent-soft); color: var(--accent); text-align: center; text-decoration: none; }
  .btn.primary { background: var(--accent); color: var(--accent-fg); }
  .btn.ghost { background: transparent; border: 1.5px solid var(--line); color: var(--fg); }
  .btn.danger { background: var(--danger-soft); color: var(--danger); }
  .btn.sm { min-height: 40px; padding: 0 12px; font-size: 0.9rem; } .btn.big { min-height: 56px; font-size: 1.1rem; }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .topbar .meta { min-width: 0; }
  .suits { letter-spacing: 0.25em; color: var(--accent); font-size: 1.1rem; }
  .stack { display: grid; gap: 12px; }
  .choice { display: grid; gap: 3px; width: 100%; padding: 16px; border-radius: 16px; border: 1.5px solid var(--line); background: var(--surface); color: var(--fg); text-decoration: none; }
  .choice b { font-size: 1.15rem; font-family: var(--font-display); } .choice span { color: var(--muted); font-size: 0.92rem; }
  .choice.main { border-color: var(--accent); background: var(--accent-soft); }
  .choice .go { float: right; color: var(--accent); }
  .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px; width: 100%; padding: 12px 14px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); }
  .row b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .row .sub { color: var(--muted); font-size: 0.85rem; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .go { color: var(--accent); font-size: 1.4rem; }
  .tag { display: inline-block; font-size: 0.7rem; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); margin-left: 6px; vertical-align: middle; }
  .pager { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .pager .btn { min-width: 112px; }
  .scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 30; display: flex; align-items: flex-end; justify-content: center; }
  .sheet { background: var(--surface); width: 100%; max-width: 560px; border-radius: 20px 20px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 12px; max-height: 92vh; }
  .grip { width: 40px; height: 4px; border-radius: 2px; background: var(--line); justify-self: center; }
  input.text { width: 100%; height: 50px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--bg); color: var(--fg); padding: 0 14px; font: inherit; font-size: 1.05rem; }
  .lines { display: grid; gap: 4px; font-size: 0.95rem; } .lines div { display: flex; justify-content: space-between; gap: 8px; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; z-index: 40; pointer-events: none; font-weight: 600; }
  .compact .choice { padding: 12px 14px; } .compact .choice span { font-size: 0.85rem; }
  .tight .choice span { display: none; } .tight .choice { padding: 10px 14px; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="layer"></div>
<script src="saves.js"></script>
<script>
(function () {
  'use strict';
  var S = window.ToepenSaves;
  var app = document.getElementById('app'), layer = document.getElementById('layer');
  var ui = { view: new URLSearchParams(location.search).get('view') === 'saves' ? 'saves' : 'menu', page: 0, size: 4, sheet: null, toast: '' };
  var toastTimer;

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function when(ts) { try { return new Date(ts).toLocaleDateString('nl-NL', { day: 'numeric', month: 'short' }); } catch (e) { return ''; } }
  function toast(m) { ui.toast = m; draw(); clearTimeout(toastTimer); toastTimer = setTimeout(function () { ui.toast = ''; draw(); }, 2400); }
  function defaultName() { var d = new Date(); return 'Toepen ' + d.getDate() + '/' + (d.getMonth() + 1); }
  function who(sum) {
    var n = sum.players.map(function (p) { return p.name; });
    return n.slice(0, 4).join(', ') + (n.length > 4 ? ' +' + (n.length - 4) : '');
  }
  function sub(rec) {
    var s = rec.sum, parts = [];
    if (s.players.length) parts.push(who(s) + (s.done ? ' · afgelopen' : ' · ronde ' + s.round));
    if (s.games) parts.push(s.games + (s.games === 1 ? ' potje' : ' potjes'));
    return when(rec.at) + (parts.length ? ' · ' + parts.join(' · ') : '');
  }

  /* ---------- Views ---------- */
  function renderMenu() {
    var cur = S.current(), h = '';
    h += '<div class="topbar"><div class="meta"><h1>Toepen</h1><div class="suits" aria-hidden="true">♠ ♥ ♣ ♦</div></div></div><div class="stack down">';
    if (cur && cur.sum.players.length && !cur.sum.done) {
      h += '<a class="choice main" href="scorebord.html"><b>Verder met je spel <span class="go">→</span></b><span>Ronde ' + cur.sum.round + ' · ' + esc(who(cur.sum)) + '</span></a>';
    }
    h += '<a class="choice" href="spelen.html?start=oefenen"><b>Alleen spelen</b><span>Tegen computerspelers, op deze telefoon. Werkt zonder internet.</span></a>';
    h += '<a class="choice" href="spelen.html?start=multi"><b>Multiplayer</b><span>Met vrienden, ieder op de eigen telefoon.</span></a>';
    h += '<a class="choice" href="scorebord.html"><b>Scores bijhouden</b><span>Het scorebord voor aan tafel, met echte kaarten.</span></a>';
    var n = S.count();
    h += '<button class="choice" data-act="saves"><b>Opgeslagen spellen en scores <span class="go">→</span></b><span>' + (n ? n + ' opgeslagen. Open er een, of bewaar je spel onder een naam.' : 'Bewaar een spel met de ranglijst onder een naam.') + '</span></button></div>';
    return h;
  }
  function renderSaves() {
    var list = S.list(), cur = S.current(), h = '';
    h += '<div class="topbar"><div class="meta"><h1>Opgeslagen</h1><div class="small muted">Spellen en scores onder een naam</div></div><button class="btn ghost sm" data-act="menu">← Terug</button></div>';
    var saveBtn = '<button class="btn primary big" data-act="new"' + (cur ? '' : ' disabled') + '>Huidig scorebord opslaan</button>' +
      (cur ? '' : '<p class="small muted" style="text-align:center">Er staat nu niets op het scorebord om op te slaan.</p>');
    if (!list.length) {
      h += '<div class="choice" style="cursor:default"><b>Nog niets opgeslagen</b><span>Tik op <b>Huidig scorebord opslaan</b> en geef het een naam, bijvoorbeeld de avond of de groep. Je vindt het hier terug.</span></div>';
      return h + '<div class="down stack">' + saveBtn + '</div>';
    }
    var size = ui.size, pages = Math.max(1, Math.ceil(list.length / size));
    if (ui.page >= pages) ui.page = pages - 1;
    h += '<div class="stack">' + list.slice(ui.page * size, ui.page * size + size).map(function (r) {
      return '<button class="row" data-act="open" data-id="' + esc(r.id) + '"><span><b>' + esc(r.name) + (r.auto ? '<span class="tag">automatisch</span>' : '') + '</b><span class="sub">' + esc(sub(r)) + '</span></span><span class="go" aria-hidden="true">›</span></button>';
    }).join('') + '</div>';
    h += '<div class="down stack">';
    if (pages > 1) h += '<div class="pager"><button class="btn ghost sm" data-act="page" data-v="-1"' + (ui.page === 0 ? ' disabled' : '') + '>‹ Vorige</button><span class="small muted">' + (ui.page + 1) + ' / ' + pages + '</span><button class="btn ghost sm" data-act="page" data-v="1"' + (ui.page >= pages - 1 ? ' disabled' : '') + '>Volgende ›</button></div>';
    return h + saveBtn + '</div>';
  }
  function renderSheet() {
    var sh = ui.sheet; if (!sh) return '';
    var inner = '';
    if (sh.type === 'new') {
      inner = '<h2>Scorebord opslaan</h2><p class="small muted">Geef het een naam. Je spelers, de stand en de ranglijst worden bewaard.</p>' +
        '<input class="text" id="savename" maxlength="40" autocomplete="off" value="' + esc(sh.name) + '" placeholder="Naam">' +
        (sh.err ? '<p class="small" style="color:var(--danger)" role="alert">' + esc(sh.err) + '</p>' : '') +
        '<button class="btn primary big" data-act="do-new">Opslaan</button>';
    } else {
      var r = S.list().filter(function (x) { return x.id === sh.id; })[0];
      if (!r) { ui.sheet = null; return ''; }
      if (sh.type === 'rename') {
        inner = '<h2>Naam wijzigen</h2><input class="text" id="savename" maxlength="40" autocomplete="off" value="' + esc(sh.name) + '" placeholder="Naam">' +
          '<button class="btn primary big" data-act="do-rename" data-id="' + esc(r.id) + '">Opslaan</button>';
      } else if (sh.type === 'delete') {
        inner = '<h2>Verwijderen?</h2><p class="muted">“' + esc(r.name) + '” wordt gewist, met de stand en de ranglijst die erin zitten. Dit kun je niet terugdraaien.</p>' +
          '<button class="btn danger big" data-act="do-delete" data-id="' + esc(r.id) + '">Ja, verwijderen</button>';
      } else {
        var s = r.sum, lines = '';
        s.players.forEach(function (p) { lines += '<div><span>' + esc(p.name) + '</span><b>' + p.score + (p.out ? ' · af' : '') + '</b></div>'; });
        var wl = s.wins.map(function (w) { return esc(w.name) + ' ' + w.wins + '×'; }).join(', ');
        inner = '<h2>' + esc(r.name) + '</h2><div class="small muted">' + esc(when(r.at)) + (r.auto ? ' · automatisch bewaard' : '') + '</div>' +
          (lines ? '<div><div class="label">Stand' + (s.done ? ' (afgelopen)' : ' · ronde ' + s.round) + '</div><div class="lines">' + lines + '</div></div>' : '<p class="small muted">Geen lopend spel, alleen de ranglijst.</p>') +
          (wl ? '<div class="small"><span class="label">Ranglijst</span><br>' + wl + (s.games ? ' · ' + s.games + (s.games === 1 ? ' potje' : ' potjes') + ' in totaal' : '') + '</div>' : '') +
          (S.current() ? '<p class="small muted">Je huidige scorebord wordt eerst automatisch bewaard.</p>' : '') +
          '<button class="btn primary big" data-act="do-open" data-id="' + esc(r.id) + '">Openen</button>' +
          '<div style="display:flex;gap:8px"><button class="btn ghost" style="flex:1" data-act="rename" data-id="' + esc(r.id) + '">Naam wijzigen</button><button class="btn danger" style="flex:1" data-act="delete" data-id="' + esc(r.id) + '">Verwijderen</button></div>';
      }
    }
    return '<div class="scrim" data-act="close"><div class="sheet" role="dialog" aria-modal="true"><div class="grip"></div>' + inner +
      '<button class="btn ghost" data-act="close">Sluiten</button></div></div>';
  }

  // Keeps everything on one screen: fewer rows per page when the phone is short.
  function draw() {
    reconcile();
    var cls = '';
    for (var lvl = 0; lvl < 3; lvl++) {
      app.className = 'wrap' + cls;
      app.innerHTML = ui.view === 'saves' ? renderSaves() : renderMenu();
      if (document.documentElement.scrollHeight <= window.innerHeight + 1) break;
      if (ui.view === 'saves') { if (ui.size > 1) { ui.size--; continue; } break; }
      cls = lvl === 0 ? ' compact' : ' compact tight';
    }
    // keep what is being typed (and where the cursor is) when the screen is drawn again
    var cur = document.activeElement, keep = cur && cur.id === 'savename' ? { a: cur.selectionStart, b: cur.selectionEnd } : null;
    layer.innerHTML = renderSheet() + (ui.toast ? '<div class="toast" role="status">' + esc(ui.toast) + '</div>' : '');
    var inp = document.getElementById('savename');
    if (inp && keep) { inp.focus(); try { inp.setSelectionRange(keep.a, keep.b); } catch (e) {} }
    else if (inp && ui.sheet && !ui.sheet.focused) { ui.sheet.focused = true; inp.focus(); inp.select(); }
  }

  /* ---------- Phone back button ---------- */
  var navHist = 0, sheetHist = 0, ignoreBack = 0;
  function mark(k) { try { history.pushState({ toepenMark: k }, '', location.href); return true; } catch (e) { return false; } }
  function unmark() { ignoreBack++; try { history.back(); } catch (e) { ignoreBack--; } }
  function reconcile() {
    if (ignoreBack > 0) return;
    var wantNav = ui.view !== 'menu' ? 1 : 0, wantSheet = ui.sheet ? 1 : 0;
    if (wantNav && !navHist) { if (mark('nav')) navHist = 1; } else if (!wantNav && navHist) { navHist = 0; unmark(); return; }
    if (wantSheet && !sheetHist) { if (mark('sheet')) sheetHist = 1; } else if (!wantSheet && sheetHist) { sheetHist = 0; unmark(); }
  }
  window.addEventListener('popstate', function () {
    if (ignoreBack > 0) { ignoreBack--; if (!ignoreBack) draw(); return; }
    if (ui.sheet) { sheetHist = 0; ui.sheet = null; draw(); }
    else if (navHist) { navHist = 0; ui.view = 'menu'; draw(); }
  });

  /* ---------- Events ---------- */
  document.addEventListener('input', function (e) { if (e.target.id === 'savename' && ui.sheet) ui.sheet.name = e.target.value; });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.id === 'savename') { var b = layer.querySelector('[data-act^=do-][class*=primary]'); if (b) b.click(); }
    if (e.key === 'Escape' && ui.sheet) { ui.sheet = null; draw(); }
  });
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]'); if (!el) return;
    if (el.classList.contains('scrim') && e.target !== el) return;
    var a = el.dataset.act, id = el.dataset.id, rec;
    switch (a) {
      case 'saves': ui.view = 'saves'; ui.page = 0; draw(); break;
      case 'menu': ui.view = 'menu'; ui.sheet = null; draw(); break;
      case 'page': ui.page += +el.dataset.v; draw(); break;
      case 'close': ui.sheet = null; draw(); break;
      case 'new': ui.sheet = { type: 'new', name: defaultName() }; draw(); break;
      case 'do-new':
        var st; try { st = JSON.parse(localStorage.getItem('toepen-scorebord-v2')); } catch (er) { st = null; }
        if (!st || !S.hasContent(st)) { ui.sheet = { type: 'new', name: ui.sheet.name, err: 'Er staat niets op het scorebord om op te slaan.' }; draw(); break; }
        rec = S.saveState(ui.sheet.name, st);
        if (!rec) { ui.sheet.err = 'Opslaan lukt niet: het geheugen van de browser is vol. Verwijder eerst een oud spel.'; draw(); break; }
        ui.sheet = null; ui.page = 0; draw(); toast('Opgeslagen als “' + rec.name + '”'); break;
      case 'open': ui.sheet = { type: 'detail', id: id }; draw(); break;
      case 'do-open':
        if (S.load(id)) location.href = 'scorebord.html'; else { ui.sheet = null; draw(); toast('Openen lukt niet: het geheugen van de browser is vol.'); }
        break;
      case 'rename': rec = S.list().filter(function (x) { return x.id === id; })[0]; ui.sheet = { type: 'rename', id: id, name: rec ? rec.name : '' }; draw(); break;
      case 'do-rename': S.rename(id, ui.sheet.name); ui.sheet = { type: 'detail', id: id }; draw(); toast('Naam gewijzigd'); break;
      case 'delete': ui.sheet = { type: 'delete', id: id }; draw(); break;
      case 'do-delete': S.remove(id); ui.sheet = null; draw(); toast('Verwijderd'); break;
    }
  });
  var resizeTimer;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      var a = document.activeElement;
      if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA')) return;  // the keyboard opening is not a reason to redraw
      ui.size = 4; draw();
    }, 200);
  });
  draw();
})();
</script>
<script>
  if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js'); });
</script>
</body>
</html>
