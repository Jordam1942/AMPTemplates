<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6b4a">
<meta name="description" content="Houd strafpunten bij voor het kaartspel Toepen.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Toepen Scorebord</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
  /* Layout: one column scoreblock; stake bar sticky on top, one card per player with tally marks (turfjes) */
  :root {
    --bg: #eef1ea;
    --surface: #fbfcf8;
    --fg: #1d2620;
    --muted: #5f6b62;
    --line: #d5dbd0;
    --accent: #1f6b4a;
    --accent-fg: #ffffff;
    --accent-soft: #dcebe2;
    --warn: #b4540f;
    --warn-soft: #fbe7d6;
    --out: #9aa39c;
    --ink: #253a2e;
    --font-display: "Bricolage Grotesque", "Arial Rounded MT Bold", system-ui, sans-serif;
    --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121a15; --surface: #1b251f; --fg: #e8eee8; --muted: #9eaba1; --line: #2c3a31;
      --accent: #4fbf89; --accent-fg: #0d1a13; --accent-soft: #1f3a2b;
      --warn: #f0a160; --warn-soft: #3a2817; --out: #5d6a61; --ink: #dfe9e1;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121a15; --surface: #1b251f; --fg: #e8eee8; --muted: #9eaba1; --line: #2c3a31;
    --accent: #4fbf89; --accent-fg: #0d1a13; --accent-soft: #1f3a2b;
    --warn: #f0a160; --warn-soft: #3a2817; --out: #5d6a61; --ink: #dfe9e1;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  body { margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: var(--font-body); font-size: 16px; line-height: 1.4;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 48px; }
  h1, h2 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
  h1 { font-size: 1.9rem; font-weight: 800; }
  h2 { font-size: 1.15rem; font-weight: 600; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .muted { color: var(--muted); }
  .label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    min-height: 48px; padding: 0 18px; border-radius: 12px; font-weight: 700;
    background: var(--accent-soft); color: var(--accent);
  }
  .btn.primary { background: var(--accent); color: var(--accent-fg); }
  .btn.ghost { background: transparent; border: 1.5px solid var(--line); color: var(--fg); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn:active:not(:disabled) { transform: scale(0.97); }

  /* Setup */
  .setup { display: grid; gap: 20px; }
  .setup-head { display: grid; gap: 4px; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 12px; }
  .name-row { display: flex; gap: 8px; align-items: center; }
  .name-row input {
    flex: 1; min-width: 0; height: 48px; border-radius: 10px; border: 1.5px solid var(--line);
    background: var(--bg); color: var(--fg); padding: 0 12px; font: inherit; font-size: 1rem;
  }
  .icon-btn { width: 48px; height: 48px; border-radius: 10px; font-size: 1.4rem; color: var(--muted); flex: none; }
  .seg { display: flex; gap: 8px; flex-wrap: wrap; }
  .seg button {
    min-height: 44px; min-width: 64px; padding: 0 14px; border-radius: 10px; font-weight: 700;
    border: 1.5px solid var(--line); font-variant-numeric: tabular-nums;
  }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }

  /* Game */
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; }
  .topbar .tools { display: flex; gap: 8px; }
  .topbar .tools .btn { min-height: 40px; padding: 0 10px; font-size: 0.9rem; white-space: nowrap; }

  .stake {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
    background: var(--ink); color: var(--bg); border-radius: 18px;
    padding: 14px 16px; display: flex; align-items: center; gap: 14px; margin-bottom: 16px;
    box-shadow: 0 6px 20px -10px rgba(0,0,0,0.5);
  }
  .stake .num { font-family: var(--font-display); font-weight: 800; font-size: 2.6rem; line-height: 1; font-variant-numeric: tabular-nums; min-width: 1.4ch; text-align: center; }
  .stake .txt { flex: 1; min-width: 0; }
  .stake .txt .label { color: inherit; opacity: 0.7; }
  .stake .txt div:last-child { font-size: 0.85rem; opacity: 0.85; }
  .stake .btn.toep { background: var(--accent); color: var(--accent-fg); font-size: 1.05rem; }
  .stake .btn.reset { background: transparent; color: inherit; border: 1.5px solid currentColor; opacity: 0.8; padding: 0 12px; }

  .players { display: grid; gap: 12px; }
  .player {
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
    padding: 14px 16px; display: grid; gap: 10px;
  }
  .player.scherp { border-color: var(--warn); box-shadow: inset 0 0 0 1px var(--warn); }
  .player.af { opacity: 0.55; }
  .p-head { display: flex; align-items: baseline; gap: 10px; }
  .p-name { flex: 1; min-width: 0; font-weight: 700; font-size: 1.15rem; overflow-wrap: anywhere; }
  .p-score { font-family: var(--font-display); font-weight: 800; font-size: 2rem; line-height: 1; font-variant-numeric: tabular-nums; }
  .p-score small { font-size: 0.9rem; color: var(--muted); font-weight: 600; }
  .chip { font-size: 0.75rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; align-self: center; }
  .chip.scherp { background: var(--warn-soft); color: var(--warn); }
  .chip.af { background: var(--line); color: var(--muted); }
  .tally { display: flex; flex-wrap: wrap; gap: 10px; min-height: 30px; align-items: center; color: var(--ink); }
  .tally svg { width: 34px; height: 30px; flex: none; }
  .tally .empty { font-size: 0.85rem; color: var(--muted); }
  .bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .bar span { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.25s ease; }
  .player.scherp .bar span { background: var(--warn); }
  .player.af .bar span { background: var(--out); }
  .p-actions { display: grid; grid-template-columns: 56px 64px 1fr; gap: 8px; }
  .p-actions .btn { padding: 0 8px; font-variant-numeric: tabular-nums; }
  .p-actions .btn.ghost { font-size: 1.3rem; }

  .winner {
    background: var(--accent); color: var(--accent-fg); border-radius: 18px; padding: 20px;
    display: grid; gap: 12px; text-align: center; margin-bottom: 16px;
  }
  .winner h2 { font-size: 1.8rem; font-weight: 800; }
  .winner .btn { background: var(--accent-fg); color: var(--accent); }

  .confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: var(--warn-soft); color: var(--fg); padding: 12px; border-radius: 12px; margin-bottom: 12px; }
  .confirm span { flex: 1; min-width: 160px; font-weight: 600; }
  .confirm .btn { min-height: 40px; }

  .help { margin-top: 24px; font-size: 0.9rem; color: var(--muted); display: grid; gap: 6px; }
  .help b { color: var(--fg); }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
(function () {
  var KEY = 'toepen-scorebord-v1';
  var app = document.getElementById('app');

  var state = load() || {
    screen: 'setup',
    names: ['Speler 1', 'Speler 2', 'Speler 3', 'Speler 4'],
    limit: 10,
    players: [],
    stake: 1,
    history: []
  };
  var confirming = false;

  function load() {
    try { var s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function snapshot() {
    state.history.push(JSON.stringify({ players: state.players, stake: state.stake }));
    if (state.history.length > 100) state.history.shift();
  }
  function undo() {
    var prev = state.history.pop();
    if (!prev) return;
    var p = JSON.parse(prev);
    state.players = p.players; state.stake = p.stake;
    commit();
  }
  function commit() { save(); render(); }

  function alive() { return state.players.filter(function (p) { return p.score < state.limit; }); }

  // Turfjes: groups of five, four strokes plus a diagonal
  function tallySvg(n) {
    var lines = '';
    for (var i = 0; i < Math.min(n, 4); i++) {
      var x = 5 + i * 7;
      lines += '<line x1="' + x + '" y1="4" x2="' + (x + 1) + '" y2="26" />';
    }
    if (n === 5) lines += '<line x1="1" y1="22" x2="33" y2="8" />';
    return '<svg viewBox="0 0 34 30" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round">' + lines + '</svg>';
  }
  function tally(score) {
    if (score <= 0) return '<span class="empty">Nog geen strafpunten</span>';
    var out = '';
    for (var left = score; left > 0; left -= 5) out += tallySvg(Math.min(left, 5));
    return out;
  }

  function renderSetup() {
    var rows = state.names.map(function (n, i) {
      return '<div class="name-row">' +
        '<input id="name-' + i + '" data-i="' + i + '" value="' + esc(n) + '" aria-label="Naam speler ' + (i + 1) + '" maxlength="20" autocomplete="off">' +
        '<button class="icon-btn" data-remove="' + i + '" aria-label="Verwijder speler ' + (i + 1) + '"' + (state.names.length <= 2 ? ' disabled' : '') + '>×</button>' +
        '</div>';
    }).join('');
    var limits = [10, 15, 21].map(function (l) {
      return '<button data-limit="' + l + '" aria-pressed="' + (state.limit === l) + '">' + l + '</button>';
    }).join('');
    app.innerHTML =
      '<div class="setup">' +
        '<div class="setup-head"><h1>Toepen</h1><div class="muted">Vul de spelers in en kies tot hoeveel strafpunten je speelt.</div></div>' +
        '<div class="panel"><div class="label">Spelers</div>' + rows +
          (state.names.length < 8 ? '<button class="btn ghost" id="add">+ Speler toevoegen</button>' : '') +
        '</div>' +
        '<div class="panel"><div class="label">Af bij</div><div class="seg">' + limits + '</div>' +
          '<div class="muted" style="font-size:0.9rem">Wie dit aantal strafpunten haalt, ligt eruit. De laatste die overblijft, wint.</div></div>' +
        '<button class="btn primary" id="start" style="min-height:56px;font-size:1.1rem">Start spel</button>' +
      '</div>';

    app.querySelectorAll('input[data-i]').forEach(function (inp) {
      inp.addEventListener('input', function () { state.names[+inp.dataset.i] = inp.value; save(); });
    });
    app.querySelectorAll('[data-remove]').forEach(function (b) {
      b.addEventListener('click', function () { state.names.splice(+b.dataset.remove, 1); commit(); });
    });
    app.querySelectorAll('[data-limit]').forEach(function (b) {
      b.addEventListener('click', function () { state.limit = +b.dataset.limit; commit(); });
    });
    var add = document.getElementById('add');
    if (add) add.addEventListener('click', function () {
      state.names.push('Speler ' + (state.names.length + 1)); commit();
      var last = document.getElementById('name-' + (state.names.length - 1));
      if (last) { last.focus(); last.select(); }
    });
    document.getElementById('start').addEventListener('click', function () {
      var names = state.names.map(function (n, i) { return n.trim() || ('Speler ' + (i + 1)); });
      state.names = names;
      state.players = names.map(function (n) { return { name: n, score: 0 }; });
      state.stake = 1; state.history = []; state.screen = 'game';
      commit();
    });
  }

  function renderGame() {
    var left = alive();
    var winner = left.length === 1 ? left[0] : null;
    var html = '';

    html += '<div class="topbar"><h1>Toepen</h1><div class="tools">' +
      '<button class="btn ghost" id="undo"' + (state.history.length ? '' : ' disabled') + '>↶ Ongedaan</button>' +
      '<button class="btn ghost" id="new">Nieuw spel</button></div></div>';

    if (confirming) {
      html += '<div class="confirm"><span>Huidige stand wissen en opnieuw beginnen?</span>' +
        '<button class="btn ghost" id="cancel">Nee</button><button class="btn primary" id="sure">Ja, nieuw spel</button></div>';
    }

    if (winner) {
      html += '<div class="winner"><div class="label" style="color:inherit;opacity:.8">Winnaar</div><h2>' + esc(winner.name) + '</h2>' +
        '<div>wint met ' + winner.score + ' strafpunt' + (winner.score === 1 ? '' : 'en') + '.</div>' +
        '<button class="btn" id="again">Nog een potje, zelfde spelers</button></div>';
    } else {
      html += '<div class="stake"><div class="num">' + state.stake + '</div>' +
        '<div class="txt"><div class="label">Inzet deze ronde</div><div>Verliezer krijgt ' + state.stake + ' strafpunt' + (state.stake === 1 ? '' : 'en') + '</div></div>' +
        (state.stake > 1 ? '<button class="btn reset" id="stakeReset" aria-label="Inzet terug naar 1">1</button>' : '') +
        '<button class="btn toep" id="toep">Toep! +1</button></div>';
    }

    html += '<div class="players">';
    state.players.forEach(function (p, i) {
      var af = p.score >= state.limit;
      var scherp = !af && p.score === state.limit - 1;
      var pct = Math.min(100, (p.score / state.limit) * 100);
      html += '<div class="player' + (af ? ' af' : '') + (scherp ? ' scherp' : '') + '">' +
        '<div class="p-head"><div class="p-name">' + esc(p.name) + '</div>' +
          (scherp ? '<span class="chip scherp">Op scherp</span>' : '') +
          (af ? '<span class="chip af">Af</span>' : '') +
          '<div class="p-score">' + p.score + '<small> / ' + state.limit + '</small></div></div>' +
        '<div class="tally" aria-label="' + p.score + ' strafpunten">' + tally(p.score) + '</div>' +
        '<div class="bar"><span style="width:' + pct + '%"></span></div>' +
        '<div class="p-actions">' +
          '<button class="btn ghost" data-minus="' + i + '" aria-label="Eén punt eraf bij ' + esc(p.name) + '"' + (p.score > 0 ? '' : ' disabled') + '>−</button>' +
          '<button class="btn" data-plus="' + i + '"' + (af || winner ? ' disabled' : '') + '>+1</button>' +
          '<button class="btn primary" data-lose="' + i + '"' + (af || winner ? ' disabled' : '') + '>Verliest +' + state.stake + '</button>' +
        '</div></div>';
    });
    html += '</div>';

    html += '<div class="help"><div><b>Toep!</b> verhoogt de inzet met 1. Tik bij de verliezer op <b>Verliest</b>; de inzet gaat daarna terug naar 1.</div>' +
      '<div>Gaat iemand niet mee na een toep, geef dan met <b>+1</b> de punten van vóór die toep.</div>' +
      '<div><b>Op scherp</b>: nog één strafpunt en je ligt eruit.</div></div>';

    app.innerHTML = html;

    on('undo', undo);
    on('new', function () { confirming = true; render(); });
    on('cancel', function () { confirming = false; render(); });
    on('sure', function () { confirming = false; state.screen = 'setup'; state.history = []; commit(); });
    on('again', function () {
      state.players.forEach(function (p) { p.score = 0; });
      state.stake = 1; state.history = []; commit();
    });
    on('toep', function () { snapshot(); state.stake++; commit(); });
    on('stakeReset', function () { snapshot(); state.stake = 1; commit(); });
    app.querySelectorAll('[data-plus]').forEach(function (b) {
      b.addEventListener('click', function () { snapshot(); state.players[+b.dataset.plus].score++; commit(); });
    });
    app.querySelectorAll('[data-minus]').forEach(function (b) {
      b.addEventListener('click', function () {
        var p = state.players[+b.dataset.minus];
        if (p.score > 0) { snapshot(); p.score--; commit(); }
      });
    });
    app.querySelectorAll('[data-lose]').forEach(function (b) {
      b.addEventListener('click', function () {
        snapshot();
        var p = state.players[+b.dataset.lose];
        p.score = Math.min(state.limit, p.score + state.stake);
        state.stake = 1;
        commit();
      });
    });
  }

  function on(id, fn) { var el = document.getElementById(id); if (el) el.addEventListener('click', fn); }

  function render() {
    if (state.screen === 'game' && state.players.length) renderGame(); else renderSetup();
  }

  render();
})();
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js'); });
  }
</script>
</body>
</html>
