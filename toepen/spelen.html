<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f6b4a">
<title>Toepen is verhuisd</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #eef1ea; color: #1d2620; font-family: system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  @media (prefers-color-scheme: dark) { body { background: #121a15; color: #e8eee8; } }
  main { max-width: 360px; display: grid; gap: 14px; }
  h1 { margin: 0; font-size: 1.6rem; }
  a.btn { display: block; padding: 16px; border-radius: 14px; background: #1f6b4a; color: #fff; font-weight: 700; text-decoration: none; font-size: 1.1rem; }
  p { margin: 0; opacity: .8; }
</style>
</head>
<body>
<main>
  <h1>Toepen is verhuisd</h1>
  <p>Je wordt doorgestuurd naar het nieuwe adres. Je opgeslagen scores en spellen gaan mee.</p>
  <a class="btn" id="go" href="https://jordam1942.github.io/Mijn-web-apps/toepen/spelen.html">Open Toepen</a>
  <p>Heb je Toepen op je beginscherm staan? Verwijder dat icoontje en zet het nieuwe adres op je beginscherm.</p>
</main>
<script>
  (function () {
    var page = 'spelen.html' === 'index.html' ? '' : 'spelen.html';
    var to = 'https://jordam1942.github.io/Mijn-web-apps/toepen/' + page + location.search + location.hash;
    document.getElementById('go').href = to;
    location.replace(to);
  })();
</script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');</script>
</body>
</html>
