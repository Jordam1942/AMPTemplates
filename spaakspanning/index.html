  r_expl_a: 'Gelijkmatige spaakspanning is bepalend voor een sterk en recht wiel. Bij deze controle is de spanning van elke spaak gemeten en waar nodig afgesteld binnen de tolerantie. Een correct gespannen wiel blijft recht onder belasting, verdeelt de krachten gelijkmatig over alle spaken en voorkomt spaakbreuk.',
  r_expl_b: 'Uw wiel is nagemeten met een professionele spaakspanningsmeter. Alle spaken zijn afzonderlijk gecontroleerd en waar nodig bijgesteld, zodat de spanning rondom gelijk is. Het resultaat is een wiel dat recht loopt, soepel rolt en bestand is tegen de belasting van alledag. Laat de spaakspanning na een harde klap of valpartij opnieuw controleren.',
  r_expl_c: 'Dit certificaat documenteert de spaakspanning per zijde, gemeten met een Unior spanningsmeter en omgerekend volgens de tabel van de fabrikant. Beoordeling: afwijking per spaak ten opzichte van het gemiddelde van de zijde, ideaal ≤ 5 %, acceptabel ≤ 10 %. Gelijkmatige spanning verdeelt de belasting over alle spaken, voorkomt het losraken van nippels en vermoeiing van spaak en velg, en houdt het wiel maatvast.',
  expl_d: 'D · Onderbouwd, met meetwaarden', r_expl_d1: 'Metingen met rekstrookjes aan belaste wielen (Burgoyne & Dilmaghanian 1993; Gavin 1996) tonen dat een wiel bij elke omwenteling op de onderste spaken staat: die verliezen even spanning. Spaken breken daarom niet door te hoge spanning, maar door vermoeiing: een te slappe of ongelijk gespannen spaak komt bij elke omwenteling even los, buigt bij de kop en breekt na verloop van tijd. Steeds strakker helpt niet: boven een bepaald punt neemt de zijdelingse stijfheid af en raakt de velg bij de spaakgaten overbelast (Ford 2018).', r_expl_d2: 'Bij dit wiel is de gemiddelde spanning {avgR} kgf rechts en {avgL} kgf links. {within} van de {n} spaken liggen binnen ±{tol} % van het gemiddelde van hun zijde; de grootste afwijking is ±{maxdev} % (acceptabel ≤ {tolw} %).', r_expl_d_before: 'Vóór het afstellen was dat {within0} van de {n}, met een grootste afwijking van ±{maxdev0} %.', r_expl_d_rear: 'Het verschil tussen rechts en links hoort bij een achterwiel: door de cassette staat de velg uit het midden van de naaf en moet de rechterzijde hoger gespannen staan om het wiel gecentreerd te houden.', expl_sample: 'Voorbeeld met fictieve waarden:', r_expl_d3_warn: 'Spaken buiten de tolerantie zijn in de meetstaat gemarkeerd; wij adviseren deze af te stellen.', r_expl_d3: 'Zo blijft elke spaak bij iedere omwenteling onder trek en blijft het wiel recht onder belasting.', r_expl_src: 'Bronnen: Burgoyne & Dilmaghanian, J. Eng. Mech. 119(3), 1993 · Gavin, J. Eng. Mech. 122(8), 1996 · Ford, Reinventing the Wheel, Northwestern Univ., 2018 · Brandt, The Bicycle Wheel, 1993',

  r_expl_a: 'Even spoke tension is what makes a wheel strong and true. During this check the tension of every spoke was measured and, where necessary, adjusted within tolerance. A correctly tensioned wheel stays true under load, shares the forces evenly between all spokes and prevents spoke breakage.',
  r_expl_b: 'Your wheel has been checked with a professional spoke tension meter. Every spoke was measured individually and adjusted where needed, so the tension is even all the way round. The result is a wheel that runs true, rolls smoothly and stands up to everyday loads. Have the spoke tension checked again after a hard impact or a crash.',
  r_expl_c: 'This certificate documents the spoke tension per side, measured with a Unior tension meter and converted using the manufacturer’s table. Assessment: deviation of each spoke from the side average, ideal ≤ 5 %, acceptable ≤ 10 %. Even tension distributes the load over all spokes, prevents nipples from loosening and fatigue of spoke and rim, and keeps the wheel dimensionally stable.',
  expl_d: 'D · Evidence-based, with readings', r_expl_d1: 'Strain-gauge measurements on loaded wheels (Burgoyne & Dilmaghanian 1993; Gavin 1996) show that a wheel stands on its bottom spokes on every revolution: they briefly lose tension. Spokes therefore do not break from too much tension but from fatigue: a spoke that is too loose or unevenly tensioned goes slack for a moment on every revolution, flexes at the head and eventually breaks. Ever tighter does not help: beyond a certain point lateral stiffness decreases and the rim is overloaded at the spoke holes (Ford 2018).', r_expl_d2: 'On this wheel the average tension is {avgR} kgf on the right and {avgL} kgf on the left. {within} of the {n} spokes lie within ±{tol} % of their side average; the largest deviation is ±{maxdev} % (acceptable ≤ {tolw} %).', r_expl_d_before: 'Before adjustment this was {within0} of {n}, with a largest deviation of ±{maxdev0} %.', r_expl_d_rear: 'The difference between right and left is inherent to a rear wheel: because of the cassette the rim sits off-centre on the hub and the right side must carry higher tension to keep the wheel centred.', expl_sample: 'Example with sample values:', r_expl_d3_warn: 'Spokes outside tolerance are marked in the readings; we recommend adjusting them.', r_expl_d3: 'This keeps every spoke in tension on every revolution and the wheel true under load.', r_expl_src: 'Sources: Burgoyne & Dilmaghanian, J. Eng. Mech. 119(3), 1993 · Gavin, J. Eng. Mech. 122(8), 1996 · Ford, Reinventing the Wheel, Northwestern Univ., 2018 · Brandt, The Bicycle Wheel, 1993',

// in deze ronde al gedraaid zijn (koppelmodel INFL_OPP/INFL_SAME). Geen volledige herberekening na elke spaak: het gemiddelde en de
// buren kloppen pas weer na de hele ronde, en losse meterstanden (±½ streep) najagen geeft slag en heen-en-weer draaien.
// Daarna: controle in de richtbank en hermeting van de verstelde spaken met hun buren; pas dan nieuw advies.

  token: null, exp: 0, fileId: null, syncing: false,

  loadGis() { return new Promise((res, rej) => { if (window.google && google.accounts && google.accounts.oauth2) return res(); if (!document.getElementById('gis')) { const sc = document.createElement('script'); sc.id = 'gis'; sc.src = 'https://accounts.google.com/gsi/client'; sc.async = true; document.head.appendChild(sc); } const t0 = now(), iv = setInterval(() => { if (window.google && google.accounts && google.accounts.oauth2) { clearInterval(iv); res(); } else if (now() - t0 > 10000) { clearInterval(iv); rej(new Error('Google-script niet geladen')); } }, 100); }); },
  async getToken(inter) {
    if (this.hasToken()) return this.token; if (!S().driveClientId) throw new Error('geen Client ID'); await this.loadGis();
    return new Promise((res, rej) => { const cl = google.accounts.oauth2.initTokenClient({ client_id: S().driveClientId, scope: DRIVE_SCOPE, callback: r => { if (r.error) rej(new Error(r.error_description || r.error)); else { this.token = r.access_token; this.exp = now() + ((r.expires_in || 3600) - 60) * 1000; res(this.token); } }, error_callback: e => rej(new Error(e && e.type ? e.type : 'geannuleerd')) }); cl.requestAccessToken({ prompt: inter ? 'consent' : '' }); });
  },
  async connect() { this.token = null; return this.getToken(true); },
  async api(url, o = {}) { const t = await this.getToken(false); const r = await fetch(url, Object.assign({}, o, { headers: Object.assign({ Authorization: 'Bearer ' + t }, o.headers || {}) })); if (r.status === 401) { this.token = null; throw new Error('sessie verlopen'); } if (!r.ok) throw new Error('Drive ' + r.status); return r; },
  async find() { if (this.fileId) return this.fileId; const r = await this.api(`https://www.googleapis.com/drive/v3/files?spaces=drive&q=${encodeURIComponent(`name='${DRIVE_FILE}' and trashed=false`)}&fields=files(id)`); const d = await r.json(); this.fileId = d.files && d.files[0] ? d.files[0].id : null; return this.fileId; },
  async pull() { const id = await this.find(); if (!id) return null; return (await this.api(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`)).json(); },
  async push(data) {
    const id = await this.find(), body = JSON.stringify(data);
    if (id) { await this.api(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body }); return; }
    const b = 'spk' + now().toString(36), mp = `--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify({ name: DRIVE_FILE, mimeType: 'application/json' })}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${b}--`;
    const r = await this.api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', { method: 'POST', headers: { 'Content-Type': `multipart/related; boundary=${b}` }, body: mp }); this.fileId = (await r.json()).id;
  },
  async sync(silent) { if (this.syncing) return { customers: 0, wheels: 0 }; this.syncing = true; try { const rem = await this.pull(); const r = rem ? mergeInto(rem) : { customers: 0, wheels: 0 }; await this.push(exportData()); S().lastSync = now(); save(true); return r; } catch (e) { if (!silent) throw e; return { customers: 0, wheels: 0, error: e.message }; } finally { this.syncing = false; } },
};

/* ================= INIT ================= */
document.documentElement.lang = lang();
if (!location.hash) nav('wheels', true);
seedCatalog(); save(true);
render();
if (S().autoSync && S().driveClientId) Drive.sync(true).then(r => { if (!r.error && (r.customers || r.wheels)) { toast(t('t_drive_updated')); render(); } });
</script>
