/* ================= WIEL VLECHTEN (vlecht-wizard) =================
   Klassieke 4-groepenmethode. Posities zoals overal in de app: velggaten 0..n-1 met de klok mee vanaf het ventiel, van rechts gezien.
   Groep 1: rechts, kop buiten, met de sleutelspaak in het rechts geboorde gat naast het ventiel; elk 2e naafgat, elk 4e velggat.
   Groep 2: links, kop buiten; de parallelle spaak in het gat aan de andere kant van het ventiel (pompkop past ertussen).
   Torderen: naaf tegen de rijrichting in, groep 1 en 2 worden duwend. Groep 3 (rechts) en 4 (links): kop binnen, trekkend, kruisen.
   Naafhoek per spaak: duwend = velggat − 2x posities, trekkend = velggat + 2x (720°·x/n), x per kant. */
function laceModel(cfg) {
  const n = cfg.n, sideOf = (p) => (p % 2 === 0) === (cfg.first === 'R') ? 'R' : 'L', md = (v) => ((v % n) + n) % n;
  const key = cfg.first === 'R' ? 0 : n - 1, par = cfg.first === 'R' ? n - 1 : 0, sp = [];
  for (let p = 0; p < n; p++) { const s = sideOf(p), x = s === 'R' ? cfg.xR : cfg.xL, base = s === 'R' ? key : par, lead = md(p - base) % 4 === 0;
    sp.push({ p, s, g: s === 'R' ? (lead ? 1 : 3) : (lead ? 2 : 4), lead, hub: lead ? p - 2 * x : p + 2 * x, key: p === key, par: p === par }); }
  return { n, key, par, sp, ok: n % 4 === 0 && n >= 16, tooMany: ['R', 'L'].some(s => (s === 'R' ? cfg.xR : cfg.xL) * 720 / n > 90) };
}
// Tekening: alleen wat de hand nu doet (dik), de rest vaag. Bij 'links boven' gespiegeld, zoals je het wiel dan ziet.
function laceSvg(M, a, mirror, big) {
  const S = 300, c = S / 2, cy = S * .54, RR = S * .39, HR = { R: S * .11, L: S * .075 }, n = M.n, f = (v) => v.toFixed(1);

    try { await navigator.share({ files: [f], title: 'Spaakspanning back-up' }); this.done(); } catch (e) { if (!e || e.name !== 'AbortError') this.download(); } },
};
// Statusregel + twee grote knoppen; zelfde blok op het startscherm en in Instellingen
function backupCard(inline) {
  const ls = S().lastBackup, days = ls ? Math.floor((Date.now() - ls) / DAY) : null, changed = (S().lastChange || 0) > (ls || 0);
  const today = ls && new Date(ls).toDateString() === new Date().toDateString(), yest = ls && new Date(ls).toDateString() === new Date(Date.now() - DAY).toDateString();
  const warn = !ls ? changed || wheels().length > 0 : changed && days >= 2;
  const txt = !ls ? t('bk_never_t') : today ? t('bk_today', { t: fmtTime(ls) }) : yest ? t('bk_yest', { t: fmtTime(ls) }) : warn ? t('bk_days', { n: days }) : t('bk_on_date', { d: fmtDate(ls) });
  if (inline) return `<div class="card px-3 py-1.5 flex items-center gap-3 min-w-0 ${warn ? 'border-amber-300' : ''}"><div class="text-xs font-bold truncate ${warn ? 'text-amber-900' : 'text-emerald-800'}">${warn ? '⚠ ' : '✓ '}${h(txt)}</div><button data-bkdl class="btn shrink-0 rounded-lg px-3 py-1.5 text-xs font-bold ${warn ? 'bg-slate-900 text-white' : 'border border-slate-300 bg-white'}">${t('bk_dl')}</button></div>`;
  return `<div class="card p-3 space-y-2 ${warn ? 'border-amber-300' : ''}"><div class="text-sm font-bold ${warn ? 'text-amber-900' : 'text-emerald-800'}">${warn ? '⚠ ' : '✓ '}${h(txt)}</div>
    <div class="grid ${Backup.canShare() ? 'grid-cols-2' : 'grid-cols-1'} gap-2"><button data-bkdl class="btn bg-slate-900 text-white rounded-lg py-3 font-bold">${t('bk_dl')}</button>${Backup.canShare() ? `<button data-bksh class="btn bg-white border border-slate-300 rounded-lg py-3 font-bold">${t('bk_share')}</button>` : ''}</div></div>`;
}
document.addEventListener('click', e => { const lf = e.target.closest && e.target.closest('[data-lfree], #tabBar a[href="#/lace"], #sideNav a[href="#/lace"]'); if (lf && DB.meta.lace && DB.meta.lace.fromCalc) { DB.meta.lace = null; save(); if (location.hash === '#/lace') setTimeout(render, 0); } });
document.addEventListener('click', e => { const t0 = e.target.closest && e.target; if (!t0) return; if (t0.closest('[data-bkdl]')) { e.preventDefault(); Backup.download(); } else if (t0.closest('[data-bksh]')) { e.preventDefault(); Backup.share(); } });
// Herstel: bestand kiezen, bevestigen, alles (ook de prullenbak) vervangen; vorige stand blijft bewaard voor 'Ongedaan maken'
async function restoreBackup(file) {
  let d; try { d = JSON.parse(await file.text()); } catch (e) { toast(t('t_invalid'), true); return; }
  if (!d || !Array.isArray(d.wheels) || !Array.isArray(d.customers)) { toast(t('t_invalid'), true); return; }
  if (!(await confirmM(t('bk_restore_q', { d: d.exportedAt ? fmtDate(d.exportedAt) + ' ' + fmtTime(d.exportedAt) : '?', w: d.wheels.filter(x => x && !x.deleted).length }), t('bk_restore')))) return;
  const prev = JSON.stringify(DB); try { localStorage.setItem(LS_KEY + '_voor_herstel', prev); } catch (e) {}
  for (const k of ['customers', 'wheels', 'calcs', 'hubs', 'rims', 'tpls']) DB[k] = Array.isArray(d[k]) ? d[k] : [];
  if (d.settings) for (const k of BK_KEYS) if (d.settings[k] !== undefined) S()[k] = d.settings[k];
  DB.meta.active = null; DB.meta.round = null; S().lastChange = now(); seedCatalog(); purgeTrash(); save(true); nav('wheels');
  undoToast(t('bk_restored'), () => { DB = JSON.parse(prev); });
}

/* ================= INIT ================= */
document.documentElement.lang = lang();
if (!location.hash) nav('wheels', true);
seedCatalog(); save(true);
render();
purgeTrash(); saveLocal();
initStorage();
</script>
