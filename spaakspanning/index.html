<style>
  :root { --ease: cubic-bezier(.2,.8,.2,1); }
  html { -webkit-tap-highlight-color: transparent; }
  body { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overscroll-behavior-y: none; -webkit-font-smoothing: antialiased; }

  input[type=text], input[type=tel], input[type=email], input[type=number], input[type=search], textarea {

<div id="toastHost" class="no-print fixed bottom-24 lg:bottom-6 inset-x-0 z-50 flex flex-col items-center gap-2 pointer-events-none px-4"></div>

<script>
/* =====================================================================
   SPAAKSPANNING WERKPLAATS — single-file SPA
   Architectuur:
     CONFIG   constante tabellen (spaaktypes, toleranties)
     STORE    localStorage-database (klanten, wielen/jobs, instellingen)
     ENGINE   omrekening + diagnose-algoritme (balans, advies, slag-risico)
     CHARTS   SVG radiale spaakgrafiek + mini-wiel
     UI       router, views, componenten, toasts, modals
     SYNC     Google Drive (Google Identity Services + Drive API)
   ===================================================================== */
'use strict';

/* ======================= CONFIG ======================= */
const SPOKE_TYPES = {
  r20:  { label: '2.0 mm rond',            sub: 'Standaard of enkel verjongd',                        R100: 57, p: 1.3, perTurn: 40 },
  r18:  { label: '1.8 mm rond',            sub: 'Ook 2.0 / 1.8 / 2.0 dubbel verjongd',                 R100: 52, p: 1.3, perTurn: 33 },
  r15:  { label: '1.5 mm dubbel verjongd', sub: '2.0 / 1.5 / 2.0 (Sapim Laser, DT Revolution)',        R100: 45, p: 1.3, perTurn: 25 },
  aero: { label: 'Plat / aero',            sub: 'Sapim CX-Ray, DT Aerolite, Pillar Wing',              R100: 50, p: 1.3, perTurn: 28 },
};
const TOL_OK = 5, TOL_WARN = 10;       // % afwijking t.o.v. gemiddelde van de zijde
const MIN_READ = 1, MAX_READ = 90;     // Unior-schaal
const SIDE_COLOR = { R: '#2563eb', L: '#ea580c' };
const DRIVE_FILE = 'spaakspanning-data.json';
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
const LS_KEY = 'spaakspanning_v2';
const PHASE_LABEL = { nul: 'Nulmeting', tussen: 'Tussenmeting', eind: 'Eindmeting' };

/* ======================= STORE ======================= */
const now = () => Date.now();
const uid = (p = 'id') => p + '_' + now().toString(36) + Math.random().toString(36).slice(2, 7);
function defaultSettings() {
  return { shop: '', mechanic: '', meter: '1752/6', sound: true, vibrate: true, calib: {}, driveClientId: '', autoSync: false, lastSync: null };
}
function emptyDB() { return { v: 2, customers: [], jobs: [], settings: defaultSettings(), meta: { active: null, draft: null, updatedAt: now() } }; }
let DB = (() => {
  try { const d = JSON.parse(localStorage.getItem(LS_KEY)); if (d && d.v === 2) { d.settings = Object.assign(defaultSettings(), d.settings || {}); return d; } } catch (e) {}
  return emptyDB();
})();
let saveTimer = null;
function save(immediate) {
  DB.meta.updatedAt = now();
  const doSave = () => { try { localStorage.setItem(LS_KEY, JSON.stringify(DB)); } catch (e) { toast('Opslaan mislukt (opslag vol?)', 'err'); } };
  clearTimeout(saveTimer);
  if (immediate) doSave(); else saveTimer = setTimeout(doSave, 150);
}
window.addEventListener('beforeunload', () => save(true));
document.addEventListener('visibilitychange', () => { if (document.hidden) { save(true); if (DB.settings.autoSync && Drive.hasToken()) Drive.sync(true); } });

const S = () => DB.settings;
const customers = () => DB.customers.filter(c => !c.deleted);
const jobs = () => DB.jobs.filter(j => !j.deleted);
const getCustomer = (id) => DB.customers.find(c => c.id === id && !c.deleted) || null;
const getJob = (id) => DB.jobs.find(j => j.id === id && !j.deleted) || null;
function upsertCustomer(c) { c.updatedAt = now(); const i = DB.customers.findIndex(x => x.id === c.id); if (i >= 0) DB.customers[i] = c; else DB.customers.push(c); save(); return c; }
function upsertJob(j) { j.updatedAt = now(); const i = DB.jobs.findIndex(x => x.id === j.id); if (i >= 0) DB.jobs[i] = j; else DB.jobs.push(j); save(); return j; }
function removeRecord(arr, id) { const r = arr.find(x => x.id === id); if (r) { r.deleted = true; r.updatedAt = now(); save(); } }
function customerName(id) { const c = getCustomer(id); return c ? c.name : 'Zonder klant'; }
function wheelLabel(w) { return (w.type === 'rear' ? 'Achterwiel' : 'Voorwiel') + ' · ' + w.spokes + ' spaken · ' + SPOKE_TYPES[w.spokeType].label; }
function fmtDate(ts) { return new Date(ts).toLocaleDateString('nl-NL', { day: '2-digit', month: 'short', year: 'numeric' }); }
function fmtDateLong(ts) { return new Date(ts).toLocaleDateString('nl-NL', { day: 'numeric', month: 'long', year: 'numeric' }); }
function fmtTime(ts) { return new Date(ts).toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' }); }

/* Meting-helpers */
function newMeasurement(wheel, prev, onlyIdx, phase) {
  const n = wheel.spokes;
  const m = { id: uid('m'), phase, createdAt: now(), updatedAt: now(), done: false, partial: !!onlyIdx };
  if (onlyIdx && prev) { m.readings = prev.readings.slice(); m.todo = onlyIdx.slice().sort((a, b) => a - b); m.total = onlyIdx.length; }
  else { m.readings = Array(n).fill(null); m.todo = Array.from({ length: n }, (_, i) => i); m.total = n; }
  return m;
}
const completeMeasurements = (j) => j.measurements.filter(m => m.done && m.readings.every(v => v != null));
function nulMeasurement(j) { return completeMeasurements(j)[0] || null; }
function eindMeasurement(j) { const c = completeMeasurements(j); return c.find(m => m.phase === 'eind') || null; }
function latestMeasurement(j) { return j.measurements[j.measurements.length - 1] || null; }
function jobScore(j) { const m = eindMeasurement(j) || completeMeasurements(j).slice(-1)[0]; return m ? analyze(m.readings, j.wheel).score : null; }

/* ======================= ENGINE ======================= */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function calibPoints(type) { return ((S().calib || {})[type] || []).filter(p => p && isFinite(p[0]) && isFinite(p[1])).slice().sort((a, b) => a[0] - b[0]); }
const isCalibrated = (type) => calibPoints(type).length >= 2;
function toKgf(reading, type) {
  const pts = calibPoints(type);
  if (pts.length >= 2) {
    let a = pts[0], b = pts[1];
    for (let i = 0; i < pts.length - 1; i++) if (reading >= pts[i][0]) { a = pts[i]; b = pts[i + 1]; }
    return Math.max(0, a[1] + (reading - a[0]) * (b[1] - a[1]) / ((b[0] - a[0]) || 1));
  }
  const st = SPOKE_TYPES[type];
  return 100 * Math.pow(reading / st.R100, st.p);
}
function sideOfIdx(i, wheel) { const f = wheel.firstSide || 'R', o = f === 'R' ? 'L' : 'R'; return i % 2 === 0 ? f : o; }
function sideLabel(side, wheel) { if (wheel.type === 'rear') return side === 'R' ? 'Rechts (aandrijfzijde)' : 'Links'; return side === 'R' ? 'Rechts' : 'Links'; }
const sideShort = (s) => s === 'R' ? 'Rechts' : 'Links';
function quantTurns(t) { const q = Math.round(t * 8) / 8; return clamp(q || 0.125, 0.125, 1); } // 1/8-slag stappen
function turnLabel(q) { return { 0.125: '1/8', 0.25: '1/4', 0.375: '3/8', 0.5: '1/2', 0.625: '5/8', 0.75: '3/4', 0.875: '7/8', 1: '1' }[q] || String(q); }

function analyze(readings, wheel) {
  const n = wheel.spokes, type = wheel.spokeType, perTurn = SPOKE_TYPES[type].perTurn;
  const spokes = readings.map((r, i) => ({ i, no: i + 1, side: sideOfIdx(i, wheel), r, kgf: r == null ? null : toKgf(r, type) }));
  const sides = {};
  for (const s of ['R', 'L']) {
    const list = spokes.filter(x => x.side === s), valid = list.filter(x => x.kgf != null);
    const sd = { spokes: list, count: valid.length, avg: null, avgR: null, min: null, max: null, maxDev: 0, meanDev: 0, within: 0 };
    if (valid.length) {
      sd.avg = valid.reduce((a, x) => a + x.kgf, 0) / valid.length;
      sd.avgR = valid.reduce((a, x) => a + x.r, 0) / valid.length;
      sd.min = Math.min(...valid.map(x => x.kgf)); sd.max = Math.max(...valid.map(x => x.kgf));
      for (const x of valid) { x.dev = (x.kgf - sd.avg) / sd.avg * 100; x.delta = x.kgf - sd.avg; sd.maxDev = Math.max(sd.maxDev, Math.abs(x.dev)); if (Math.abs(x.dev) <= TOL_OK) sd.within++; }
      sd.meanDev = valid.reduce((a, x) => a + Math.abs(x.dev), 0) / valid.length;
    }
    sides[s] = sd;
  }
  const valid = spokes.filter(x => x.dev != null);
  const maxDev = Math.max(sides.R.maxDev, sides.L.maxDev);
  const meanDev = valid.length ? valid.reduce((a, x) => a + Math.abs(x.dev), 0) / valid.length : 0;
  const score = valid.length ? clamp(Math.round(100 - 1.5 * maxDev - 2 * meanDev), 0, 100) : 0;
  const within = sides.R.within + sides.L.within;

  // Acties per spaak
  const byIdx = {};
  const actions = [], perfect = [], missing = [];
  for (const x of spokes) {
    if (x.kgf == null) { missing.push(x.no); continue; }
    if (Math.abs(x.dev) <= TOL_OK) { perfect.push(x.no); continue; }
    const tq = quantTurns(Math.abs(x.delta) / perTurn);
    const a = { i: x.i, no: x.no, side: x.side, dev: x.dev, abs: Math.abs(x.dev), dir: x.dev < 0 ? 'tighten' : 'loosen', turns: tq, turnLabel: turnLabel(tq), urgent: Math.abs(x.dev) > TOL_WARN, notes: [] };
    actions.push(a); byIdx[x.i] = a;
  }
  // Zijdelingse slag: buurspaken (andere zijde) en tegenoverliggende spaak (rondheid)
  for (const a of actions) {
    const nb = [(a.i - 1 + n) % n, (a.i + 1) % n].map(j => byIdx[j]).filter(Boolean);
    const opp = nb.filter(b => b.dir !== a.dir), same = nb.filter(b => b.dir === a.dir);
    if (opp.length) a.notes.push(`Zijdelingse slag: wissel af met spaak #${opp.map(b => b.no).join(' en #')} (andere kant), in stapjes van 1/8.`);
    else if (same.length) a.notes.push(`Doe dit samen met spaak #${same.map(b => b.no).join(' en #')} aan de andere kant, dan blijft het wiel recht.`);
    else if (a.turns >= 0.5) a.notes.push('Draai in twee stappen en controleer tussendoor de zijdelingse slag.');
    const across = byIdx[(a.i + n / 2) % n];
    if (across && across.side === a.side && across.dir !== a.dir) a.notes.push(`Tegenoverliggende spaak #${across.no} wijkt tegengesteld af: let op de rondheid (hoogteslag).`);
  }
  actions.sort((a, b) => b.abs - a.abs);
  perfect.sort((a, b) => a - b);

  // Absoluut niveau (indicatief) voor de strak gespannen zijde
  let level = null;
  const hiSide = wheel.type === 'rear' ? 'R' : ((sides.R.avg || 0) >= (sides.L.avg || 0) ? 'R' : 'L');
  const hi = sides[hiSide];
  if (hi.avg != null && hi.count >= 3) {
    if (hi.avg < 75) level = { kind: 'low', text: `Het wiel staat als geheel vrij slap (≈ ${Math.round(hi.avg)} kgf ${sideShort(hiSide).toLowerCase()}). Zodra de balans goed is: alle spaken ${sideShort(hiSide).toLowerCase()} 1/4 slag vaster en opnieuw meten.` };
    else if (hi.avg > 140) level = { kind: 'high', text: `Het wiel staat erg strak (≈ ${Math.round(hi.avg)} kgf ${sideShort(hiSide).toLowerCase()}). Zodra de balans goed is: alle spaken ${sideShort(hiSide).toLowerCase()} 1/4 slag losser en opnieuw meten.` };
  }
  return { spokes, sides, score, maxDev, meanDev, within, n, filled: valid.length, complete: valid.length === n, actions, perfect, missing, level, calibrated: isCalibrated(type) };
}
function scoreInfo(score) {
  if (score >= 90) return { label: 'Perfecte balans', tone: 'emerald', hex: '#10b981' };
  if (score >= 75) return { label: 'Goede balans', tone: 'emerald', hex: '#34d399' };
  if (score >= 55) return { label: 'Matig · bijstellen aanbevolen', tone: 'amber', hex: '#f59e0b' };
  return { label: 'Onvoldoende · bijstellen nodig', tone: 'rose', hex: '#f43f5e' };
}
function groupRanges(nums) { // [1,2,3,5,7,8] -> "1 t/m 3, 5, 7, 8"
  if (!nums.length) return '';
  const out = []; let a = nums[0], b = nums[0];
  for (let k = 1; k <= nums.length; k++) {
    if (k < nums.length && nums[k] === b + 1) { b = nums[k]; continue; }
    out.push(a === b ? `${a}` : (b === a + 1 ? `${a}, ${b}` : `${a} t/m ${b}`));
    if (k < nums.length) { a = nums[k]; b = nums[k]; }
  }
  return out.join(', ');
}

/* ======================= CHARTS ======================= */
function radialChart(an, wheel, size, opts = {}) {
  const n = wheel.spokes, c = size / 2, R0 = size * 0.33, labelR = size * 0.445;
  const ang = (i) => (-90 + i * 360 / n) * Math.PI / 180;
  const pt = (i, r) => [c + r * Math.cos(ang(i)), c + r * Math.sin(ang(i))];
  let o = `<svg viewBox="0 0 ${size} ${size}" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">`;
  o += `<circle cx="${c}" cy="${c}" r="${R0 * 1.1}" fill="#d1fae5"/><circle cx="${c}" cy="${c}" r="${R0 * 0.9}" fill="#fff"/>`;
  o += `<circle cx="${c}" cy="${c}" r="${R0}" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="4 4"/>`;
  for (let i = 0; i < n; i++) { const [x, y] = pt(i, R0 * 1.25); o += `<line x1="${c}" y1="${c}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#e2e8f0"/>`; }
  { const va = (-90 - 180 / n) * Math.PI / 180, vx = c + labelR * Math.cos(va), vy = c + labelR * Math.sin(va);
    o += `<polygon points="${(vx - size * .014).toFixed(1)},${(vy - size * .012).toFixed(1)} ${(vx + size * .014).toFixed(1)},${(vy - size * .012).toFixed(1)} ${vx.toFixed(1)},${(vy + size * .014).toFixed(1)}" fill="#0f172a"/>`; }
  for (const s of ['R', 'L']) {
    const sd = an.sides[s]; if (!sd.avg) continue;
    const pts = sd.spokes.filter(x => x.kgf != null).map(x => pt(x.i, R0 * clamp(x.kgf / sd.avg, 0.4, 1.6)));
    if (pts.length >= 3) o += `<path d="M${pts.map(p => p.map(v => v.toFixed(1)).join(',')).join(' L')} Z" fill="${SIDE_COLOR[s]}" fill-opacity=".07" stroke="${SIDE_COLOR[s]}" stroke-width="2.2" stroke-linejoin="round"/>`;
  }
  for (const x of an.spokes) {
    if (opts.labels !== false) { const [lx, ly] = pt(x.i, labelR); o += `<text x="${lx.toFixed(1)}" y="${(ly + size * .012).toFixed(1)}" text-anchor="middle" font-size="${size * .034}" fill="#64748b">${x.no}</text>`; }
    const sd = an.sides[x.side]; if (x.kgf == null || !sd.avg) continue;
    const [px, py] = pt(x.i, R0 * clamp(x.kgf / sd.avg, 0.4, 1.6));
    const ad = Math.abs(x.dev), fill = ad <= TOL_OK ? '#10b981' : ad <= TOL_WARN ? '#f59e0b' : '#f43f5e';
    o += `<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="${size * .014}" fill="${fill}" stroke="#fff" stroke-width="1.5"/>`;
  }
  return o + '</svg>';
}
function chartLegend(small) {
  const t = small ? 'text-[10px]' : 'text-xs';
  return `<div class="flex flex-wrap gap-x-4 gap-y-1 ${t} text-slate-500 mt-2">
    <span><i class="inline-block w-3 h-1.5 rounded align-middle" style="background:${SIDE_COLOR.R}"></i> Rechts</span>
    <span><i class="inline-block w-3 h-1.5 rounded align-middle" style="background:${SIDE_COLOR.L}"></i> Links</span>
    <span>▲ ventiel</span><span>groene band = ±${TOL_WARN} %</span><span>stippellijn = gemiddelde van de zijde</span></div>`;
}
function miniWheel(readings, n, cur, todo) {
  const c = 50; let o = `<svg viewBox="0 0 100 100" width="100%" xmlns="http://www.w3.org/2000/svg">`;
  o += `<circle cx="${c}" cy="${c}" r="44" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="3"/><circle cx="${c}" cy="${c}" r="9" fill="rgba(255,255,255,.55)"/>`;
  for (let i = 0; i < n; i++) {
    const a = (-90 + i * 360 / n) * Math.PI / 180;

};

          <tbody>${['R', 'L'].map(s => { const sd = an.sides[s]; return `<tr><td class="py-1 font-semibold">${sideLabel(s, w)}</td><td class="text-right px-1">${sd.count}</td><td class="text-right px-1">${sd.avg != null ? Math.round(sd.avg) : '–'}</td><td class="text-right px-1">${sd.min != null ? Math.round(sd.min) + ' – ' + Math.round(sd.max) : '–'}</td><td class="text-right">${sd.avg != null ? '±' + Math.round(sd.maxDev) + ' %' : '–'}</td></tr>`; }).join('')}</tbody></table>
        <div class="mt-2 text-xs text-slate-600"><div><i class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-500 align-middle"></i> binnen ±${TOL_OK} % van het gemiddelde (ideaal)</div><div><i class="inline-block w-2.5 h-2.5 rounded-full bg-amber-500 align-middle"></i> ${TOL_OK}–${TOL_WARN} % afwijking</div><div><i class="inline-block w-2.5 h-2.5 rounded-full bg-rose-500 align-middle"></i> meer dan ${TOL_WARN} % afwijking</div></div>
        <div class="mt-2 text-xs">${an.within} van ${an.n} spaken binnen de ideale tolerantie.</div></div></div>

      <div class="grid gap-1 text-[10px] text-center" style="grid-template-columns:repeat(${w.spokes <= 24 ? 12 : 16},minmax(0,1fr))">${m.readings.map((v, i) => { const x = an.spokes[i], ad = x.dev != null ? Math.abs(x.dev) : null; const cl = ad == null ? 'bg-slate-100' : ad <= TOL_OK ? 'bg-emerald-100' : ad <= TOL_WARN ? 'bg-amber-100' : 'bg-rose-100'; return `<div class="${cl} rounded py-0.5"><div class="text-slate-500">#${i + 1}</div><div class="font-bold">${v ?? '–'}</div></div>`; }).join('')}</div></div>

  $('#view').innerHTML = `<div class="fade-in max-w-4xl mx-auto">
    <div class="no-print card p-4 mb-4 flex flex-col sm:flex-row sm:items-center gap-3">
      <div class="flex-1 text-sm text-slate-600">Certificaat op basis van de <b>${PHASE_LABEL[m.phase]}</b> van ${fmtDate(m.updatedAt)}${anNul ? ', vergeleken met de nulmeting' : ''}. Past op 1 A4. Kies in het printvenster "Opslaan als PDF" voor een PDF.</div>
      <button id="btnPrint" class="btn bg-slate-900 text-white rounded-xl px-5 py-3.5 font-bold flex items-center justify-center gap-2 shrink-0">${I.print} Print certificaat</button></div>

/* ======================= SYNC: export / merge ======================= */
function exportData() { return { v: 2, exportedAt: now(), customers: DB.customers, jobs: DB.jobs }; }
function mergeInto(remote) { // nieuwste record (updatedAt) wint; verwijderingen zijn tombstones
  let nc = 0, nj = 0;
  const mergeList = (local, incoming, cb) => { for (const r of incoming || []) { if (!r || !r.id) continue; const i = local.findIndex(x => x.id === r.id); if (i < 0) { local.push(r); cb(); } else if ((r.updatedAt || 0) > (local[i].updatedAt || 0)) { local[i] = r; cb(); } } };
  mergeList(DB.customers, remote.customers, () => nc++);
  mergeList(DB.jobs, remote.jobs, () => nj++);
  return { customers: nc, jobs: nj };
}

/* ======================= SYNC: Google Drive ======================= */
const Drive = {
  token: null, exp: 0, fileId: null, syncing: false,
  hasToken() { return !!this.token && now() < this.exp; },
  loadGis() {
    return new Promise((res, rej) => {
      if (window.google && google.accounts && google.accounts.oauth2) return res();
      if (!document.getElementById('gis')) { const sc = document.createElement('script'); sc.id = 'gis'; sc.src = 'https://accounts.google.com/gsi/client'; sc.async = true; document.head.appendChild(sc); }
      const t0 = now(); const iv = setInterval(() => { if (window.google && google.accounts && google.accounts.oauth2) { clearInterval(iv); res(); } else if (now() - t0 > 10000) { clearInterval(iv); rej(new Error('Google-script niet geladen (internet?)')); } }, 100);
    });
  },
  async getToken(interactive) {
    if (this.hasToken()) return this.token;
    if (!S().driveClientId) throw new Error('geen Client ID ingesteld');
    await this.loadGis();
    return new Promise((res, rej) => {
      const client = google.accounts.oauth2.initTokenClient({
        client_id: S().driveClientId, scope: DRIVE_SCOPE,
        callback: (r) => { if (r.error) rej(new Error(r.error_description || r.error)); else { this.token = r.access_token; this.exp = now() + ((r.expires_in || 3600) - 60) * 1000; res(this.token); } },
        error_callback: (e) => rej(new Error(e && e.type ? e.type : 'geannuleerd')),
      });
      client.requestAccessToken({ prompt: interactive ? 'consent' : '' });
    });
  },
  async connect() { this.token = null; return this.getToken(true); },
  async api(url, opts = {}) {
    const t = await this.getToken(false);
    const r = await fetch(url, Object.assign({}, opts, { headers: Object.assign({ Authorization: 'Bearer ' + t }, opts.headers || {}) }));
    if (r.status === 401) { this.token = null; throw new Error('sessie verlopen, verbind opnieuw'); }
    if (!r.ok) throw new Error('Drive antwoordde ' + r.status);
    return r;
  },
  async find() {
    if (this.fileId) return this.fileId;
    const r = await this.api(`https://www.googleapis.com/drive/v3/files?spaces=drive&q=${encodeURIComponent(`name='${DRIVE_FILE}' and trashed=false`)}&fields=files(id,modifiedTime)`);
    const d = await r.json(); this.fileId = d.files && d.files[0] ? d.files[0].id : null; return this.fileId;
  },
  async pull() { const id = await this.find(); if (!id) return null; const r = await this.api(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`); return r.json(); },
  async push(data) {
    const id = await this.find(), body = JSON.stringify(data);
    if (id) { await this.api(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body }); return; }
    const boundary = 'spk' + now().toString(36);
    const multipart = `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify({ name: DRIVE_FILE, mimeType: 'application/json' })}\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${boundary}--`;
    const r = await this.api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', { method: 'POST', headers: { 'Content-Type': `multipart/related; boundary=${boundary}` }, body: multipart });
    this.fileId = (await r.json()).id;
  },
  async sync(silent) {
    if (this.syncing) return { customers: 0, jobs: 0 };
    this.syncing = true;
    try {
      const remote = await this.pull();
      const r = remote ? mergeInto(remote) : { customers: 0, jobs: 0 };
      await this.push(exportData());
      S().lastSync = now(); save(true); renderNav();
      return r;
    } catch (e) { if (!silent) throw e; return { customers: 0, jobs: 0, error: e.message }; }
    finally { this.syncing = false; }
  },
};

/* ======================= INIT ======================= */
if (!location.hash) navigate('home', true);
render();
if (S().autoSync && S().driveClientId) Drive.sync(true).then(r => { if (!r.error && (r.customers || r.jobs)) toast(`Drive: ${r.customers} klanten, ${r.jobs} wielen bijgewerkt`, 'info'); });
</script>
