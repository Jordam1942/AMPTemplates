<script>
'use strict';
/* ================= CONFIG ================= */
/* Spaken: kop / midden / draad in mm. De meter zit op het middenstuk, dus 'mid' bepaalt de omrekening.
   mid = ronde diameter, of 'a' + dikte x breedte voor platte spaken. Indicatieve curve; exact via Kalibratie per dikte. */
const SPOKES = [
  ['sapim',  'Sapim', 'Leader 2.0',       '2.0 recht',             2.0],
  ['sapim',  'Sapim', 'Leader 1.8',       '1.8 recht',             1.8],
  ['sapim',  'Sapim', 'Strong',           '2.3 / 2.0',             2.0],
  ['sapim',  'Sapim', 'Race',             '2.0 / 1.8 / 2.0',       1.8],
  ['sapim',  'Sapim', 'Force',            '2.18 / 1.8 / 2.0',      1.8],
  ['sapim',  'Sapim', 'D-Light',          '2.0 / 1.65 / 2.0',      1.65],
  ['sapim',  'Sapim', 'Laser',            '2.0 / 1.5 / 2.0',       1.5],
  ['sapim',  'Sapim', 'CX-Ray',           '2.0 / 0.9×2.2 / 2.0',   'a0.9x2.2'],
  ['sapim',  'Sapim', 'CX-Sprint',        '2.0 / 1.25×2.3 / 2.0',  'a1.25x2.3'],
  ['dt',     'DT Swiss', 'Champion 2.0',  '2.0 recht',             2.0],
  ['dt',     'DT Swiss', 'Champion 1.8',  '1.8 recht',             1.8],
  ['dt',     'DT Swiss', 'Alpine III',    '2.34 / 1.8 / 2.0',      1.8],
  ['dt',     'DT Swiss', 'Competition',   '2.0 / 1.8 / 2.0',       1.8],
  ['dt',     'DT Swiss', 'Competition Race', '2.0 / 1.6 / 2.0',    1.6],
  ['dt',     'DT Swiss', 'Super Comp',    '2.0 / 1.7 / 1.8',       1.7],
  ['dt',     'DT Swiss', 'Revolution',    '2.0 / 1.5 / 2.0',       1.5],
  ['dt',     'DT Swiss', 'Aero Comp',     '2.0 / 1.2×2.3 / 2.0',   'a1.2x2.3'],
  ['dt',     'DT Swiss', 'Aerolite',      '2.0 / 0.9×2.3 / 2.0',   'a0.9x2.3'],
  ['alpina', 'Alpina', 'Spark',           '2.3 / 2.0',             2.0],
  ['alpina', 'Alpina', 'Basiclite',       '2.0 / 1.8 / 2.0',       1.8],
  ['alpina', 'Alpina', 'Extralite',       '2.0 / 1.7 / 2.0',       1.7],
  ['alpina', 'Alpina', 'Superlite',       '2.0 / 1.6 / 2.0',       1.6],
  ['alpina', 'Alpina', 'Ultralite',       '2.0 / 1.5 / 2.0',       1.5],
  ['alpina', 'Alpina', 'Hyperlite',       '2.0 / 1.3 / 2.0',       1.3],
  ['alpina', 'Alpina', 'Ultralite Aero',  '2.0 / 0.9×2.2 / 2.0',   'a0.9x2.2'],
  ['x',      'Anders', '2.3 rond',        'midden 2.3',            2.3],
  ['x',      'Anders', '2.0 rond',        'midden 2.0',            2.0],
  ['x',      'Anders', '1.8 rond',        'midden 1.8',            1.8],
  ['x',      'Anders', '1.7 rond',        'midden 1.7',            1.7],
  ['x',      'Anders', '1.6 rond',        'midden 1.6',            1.6],
  ['x',      'Anders', '1.5 rond',        'midden 1.5',            1.5],
  ['x',      'Anders', 'plat / aero',     'ca. 0.9×2.2',           'a0.9x2.2'],
];
/* Indicatieve curve per middenmaat: meterstand bij 100 kgf (R100) en kgf per hele slag (perTurn). */
function midProps(mid) {
  let d = typeof mid === 'number' ? mid : null, area;
  if (d == null) { const [a, b] = mid.slice(1).split('x').map(Number); area = a * b; d = Math.sqrt(area * 4 / Math.PI); }
  else area = Math.PI * d * d / 4;
  return { R100: Math.round((42 + (d - 1.4) * 30) * 10) / 10, p: 1.3, perTurn: Math.round(40 * area / (Math.PI)) , cal: typeof mid === 'number' ? String(mid) : mid };
}
const SPOKE_TYPES = {};
for (const [brandId, brand, model, sub, mid] of SPOKES) { const id = brandId + '_' + model.toLowerCase().replace(/[^a-z0-9]+/g, ''); SPOKE_TYPES[id] = Object.assign({ id, brand, model, label: brand === 'Anders' ? model : brand + ' ' + model, sub, mid }, midProps(mid)); }
for (const [old, nw] of [['r20', 'x_20rond'], ['r18', 'x_18rond'], ['r15', 'x_15rond'], ['aero', 'x_plataero'], ['race', 'sapim_race'], ['leader', 'sapim_leader20'], ['strong', 'sapim_strong'], ['force', 'sapim_force'], ['dlight', 'sapim_dlight'], ['laser', 'sapim_laser'], ['cxray', 'sapim_cxray'], ['cxsprint', 'sapim_cxsprint']]) SPOKE_TYPES[old] = SPOKE_TYPES[nw];
const CAL_CLASSES = [...new Set(SPOKES.map(x => midProps(x[4]).cal))].sort((a, b) => (a[0] === 'a') - (b[0] === 'a') || parseFloat(a.replace('a', '')) - parseFloat(b.replace('a', '')));
const calLabel = (c) => c[0] === 'a' ? 'plat ' + c.slice(1).replace('x', '×') : 'rond ' + c;
const TOL_OK = 5, TOL_WARN = 10, MIN_READ = 1, MAX_READ = 90;
const COL = { R: '#2563eb', L: '#ea580c' };
const LS_KEY = 'spaakspanning_v3', DRIVE_FILE = 'spaakspanning-data.json', DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
const PHASE = { nul: 'Nulmeting', tussen: 'Tussenmeting', eind: 'Eindmeting' };

/* ================= STORE ================= */
const now = () => Date.now();
const uid = (p) => p + '_' + now().toString(36) + Math.random().toString(36).slice(2, 6);
const defSettings = () => ({ shop: '', mechanic: '', meter: '1752/6', sound: true, vibrate: true, calib: {}, driveClientId: '', autoSync: false, lastSync: null });
const emptyDB = () => ({ v: 3, customers: [], wheels: [], settings: defSettings(), meta: { active: null } });
let DB = (() => { try { const d = JSON.parse(localStorage.getItem(LS_KEY)); if (d && d.v === 3) { d.settings = Object.assign(defSettings(), d.settings || {}); return d; } } catch (e) {} return emptyDB(); })();
let saveT = null;
function save(imm) { const f = () => { try { localStorage.setItem(LS_KEY, JSON.stringify(DB)); } catch (e) {} }; clearTimeout(saveT); if (imm) f(); else saveT = setTimeout(f, 120); }
window.addEventListener('beforeunload', () => save(true));
document.addEventListener('visibilitychange', () => { if (document.hidden) { save(true); if (S().autoSync && Drive.hasToken()) Drive.sync(true); } });
const S = () => DB.settings;
const customers = () => DB.customers.filter(c => !c.deleted);
const wheels = () => DB.wheels.filter(w => !w.deleted);
const getCustomer = (id) => DB.customers.find(c => c.id === id && !c.deleted) || null;
const getWheel = (id) => DB.wheels.find(w => w.id === id && !w.deleted) || null;
function upsert(arr, r) { r.updatedAt = now(); const i = arr.findIndex(x => x.id === r.id); if (i >= 0) arr[i] = r; else arr.push(r); save(); return r; }
function remove(arr, id) { const r = arr.find(x => x.id === id); if (r) { r.deleted = true; r.updatedAt = now(); save(); } }
const custName = (id) => { const c = getCustomer(id); return c ? c.name : ''; };
const wheelLabel = (w) => (w.type === 'rear' ? 'Achter' : 'Voor') + ' · ' + w.spokes + ' · ' + SPOKE_TYPES[w.spokeType].label;
const fmtDate = (t) => new Date(t).toLocaleDateString('nl-NL', { day: '2-digit', month: '2-digit', year: 'numeric' });
const fmtDateLong = (t) => new Date(t).toLocaleDateString('nl-NL', { day: 'numeric', month: 'long', year: 'numeric' });
const fmtTime = (t) => new Date(t).toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });

/* meting: R[] en L[] per zijde, todo per zijde */
function newMeasurement(w, prev, only, phase) {
  const h = w.spokes / 2, m = { id: uid('m'), phase, createdAt: now(), updatedAt: now(), done: false, partial: !!only };
  for (const s of ['R', 'L']) { m[s] = only && prev ? prev[s].slice() : Array(h).fill(null); }
  m.todo = only ? { R: only.R.slice().sort((a, b) => a - b), L: only.L.slice().sort((a, b) => a - b) } : { R: [...Array(h).keys()], L: [...Array(h).keys()] };
  m.total = m.todo.R.length + m.todo.L.length;
  return m;
}
const complete = (w) => w.measurements.filter(m => m.done && m.R.every(v => v != null) && m.L.every(v => v != null));
const nulM = (w) => complete(w)[0] || null;
const eindM = (w) => complete(w).find(m => m.phase === 'eind') || null;
const lastM = (w) => w.measurements[w.measurements.length - 1] || null;
const wheelScore = (w) => { const m = eindM(w) || complete(w).slice(-1)[0]; return m ? analyze(m, w).score : null; };

/* ================= ENGINE ================= */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const calibPts = (t) => ((S().calib || {})[SPOKE_TYPES[t] ? SPOKE_TYPES[t].cal : t] || []).filter(p => p && isFinite(p[0]) && isFinite(p[1])).slice().sort((a, b) => a[0] - b[0]);
const isCal = (t) => calibPts(t).length >= 2;
function toKgf(r, t) {
  const p = calibPts(t);
  if (p.length >= 2) { let a = p[0], b = p[1]; for (let i = 0; i < p.length - 1; i++) if (r >= p[i][0]) { a = p[i]; b = p[i + 1]; } return Math.max(0, a[1] + (r - a[0]) * (b[1] - a[1]) / ((b[0] - a[0]) || 1)); }
  const st = SPOKE_TYPES[t]; return 100 * Math.pow(r / st.R100, st.p);
}
const turnLbl = (q) => ({ 0.125: '1/8', 0.25: '1/4', 0.375: '3/8', 0.5: '1/2', 0.625: '5/8', 0.75: '3/4', 0.875: '7/8', 1: '1' })[q] || q;
function analyze(m, w) {
  const t = w.spokeType, perTurn = SPOKE_TYPES[t].perTurn, out = { sides: {}, actions: [], within: 0, filled: 0, n: w.spokes };
  let maxDev = 0, sumDev = 0;
  for (const s of ['R', 'L']) {
    const vals = m[s], sp = vals.map((r, i) => ({ s, i, no: i + 1, r, kgf: r == null ? null : toKgf(r, t), dev: null }));
    const valid = sp.filter(x => x.kgf != null);
    const sd = { spokes: sp, count: valid.length, avg: null, avgR: null, min: null, max: null, maxDev: 0, within: 0, actions: [] };
    if (valid.length) {
      sd.avg = valid.reduce((a, x) => a + x.kgf, 0) / valid.length; sd.avgR = valid.reduce((a, x) => a + x.r, 0) / valid.length;
      sd.min = Math.min(...valid.map(x => x.kgf)); sd.max = Math.max(...valid.map(x => x.kgf));
      for (const x of valid) {
        x.dev = (x.kgf - sd.avg) / sd.avg * 100; const ad = Math.abs(x.dev);
        sd.maxDev = Math.max(sd.maxDev, ad); maxDev = Math.max(maxDev, ad); sumDev += ad; out.filled++;
        if (ad <= TOL_OK) { sd.within++; continue; }
        const q = clamp(Math.round(Math.abs(x.kgf - sd.avg) / perTurn * 8) / 8 || 0.125, 0.125, 1);
        const a = { s, i: x.i, no: x.no, dev: x.dev, dir: x.dev < 0 ? 'vaster' : 'losser', turn: turnLbl(q), urgent: ad > TOL_WARN };
        sd.actions.push(a); out.actions.push(a);
      }
    }
    out.within += sd.within; out.sides[s] = sd;
  }
  const meanDev = out.filled ? sumDev / out.filled : 0;
  out.score = out.filled ? clamp(Math.round(100 - 1.5 * maxDev - 2 * meanDev), 0, 100) : 0;
  out.maxDev = maxDev; out.complete = out.filled === w.spokes; out.cal = isCal(t);
  return out;
}
const scoreInfo = (s) => s >= 90 ? { label: 'Perfect', hex: '#10b981', cls: 'text-emerald-700' } : s >= 75 ? { label: 'Goed', hex: '#34d399', cls: 'text-emerald-700' } : s >= 55 ? { label: 'Matig', hex: '#f59e0b', cls: 'text-amber-700' } : { label: 'Onvoldoende', hex: '#f43f5e', cls: 'text-rose-700' };
const devCls = (d) => d == null ? 'bg-slate-100 text-slate-400' : Math.abs(d) <= TOL_OK ? 'bg-emerald-100' : Math.abs(d) <= TOL_WARN ? 'bg-amber-100' : 'bg-rose-100';

/* ================= CHARTS ================= */
function radialChart(an, w, size) {
  const n = w.spokes, c = size / 2, R0 = size * .33, LR = size * .445;
  const ang = (k) => (-90 + k * 360 / n) * Math.PI / 180, pt = (k, r) => [c + r * Math.cos(ang(k)), c + r * Math.sin(ang(k))];
  const idx = (x) => x.s === 'R' ? 2 * x.i : 2 * x.i + 1;
  let o = `<svg viewBox="0 0 ${size} ${size}" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="Inter,sans-serif">`;
  o += `<circle cx="${c}" cy="${c}" r="${R0 * 1.1}" fill="#d1fae5"/><circle cx="${c}" cy="${c}" r="${R0 * .9}" fill="#fff"/><circle cx="${c}" cy="${c}" r="${R0}" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="4 4"/>`;
  for (let k = 0; k < n; k++) { const [x, y] = pt(k, R0 * 1.25); o += `<line x1="${c}" y1="${c}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#e2e8f0"/>`; }
  for (const s of ['R', 'L']) {
    const sd = an.sides[s]; if (!sd.avg) continue;
    const pts = sd.spokes.filter(x => x.kgf != null).map(x => pt(idx(x), R0 * clamp(x.kgf / sd.avg, .4, 1.6)));
    if (pts.length > 2) o += `<path d="M${pts.map(p => p.map(v => v.toFixed(1)).join(',')).join('L')}Z" fill="${COL[s]}" fill-opacity=".07" stroke="${COL[s]}" stroke-width="2.2" stroke-linejoin="round"/>`;
    for (const x of sd.spokes) {
      const [lx, ly] = pt(idx(x), LR); o += `<text x="${lx.toFixed(1)}" y="${(ly + size * .011).toFixed(1)}" text-anchor="middle" font-size="${size * .03}" font-weight="600" fill="${COL[s]}">${s}${x.no}</text>`;
      if (x.kgf == null) continue; const [px, py] = pt(idx(x), R0 * clamp(x.kgf / sd.avg, .4, 1.6)), ad = Math.abs(x.dev);
      o += `<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="${size * .013}" fill="${ad <= TOL_OK ? '#10b981' : ad <= TOL_WARN ? '#f59e0b' : '#f43f5e'}" stroke="#fff" stroke-width="1.5"/>`;
    }
  }
  return o + '</svg>';
}
function ring(score, size, st) {
  const r = (size - st) / 2, C = 2 * Math.PI * r, i = scoreInfo(score);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="#e2e8f0" stroke-width="${st}"/><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${i.hex}" stroke-width="${st}" stroke-linecap="round" transform="rotate(-90 ${size / 2} ${size / 2})" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - score / 100)}"/><text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" font-size="${size * .32}" font-weight="800" fill="#0f172a">${score}</text></svg>`;
}

/* ================= UI basis ================= */
const $ = (s, el = document) => el.querySelector(s), $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const h = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function toast(msg, err) { const el = document.createElement('div'); el.className = 'toast pointer-events-auto px-4 py-2.5 rounded-lg text-sm font-semibold text-white ' + (err ? 'bg-rose-600' : 'bg-slate-900'); el.textContent = msg; $('#toastHost').appendChild(el); setTimeout(() => el.remove(), 2500); }
function modal(html, sticky) { closeModal(); $('#modalHost').innerHTML = `<div id="mb" class="fixed inset-0 z-40 bg-slate-900/50 flex items-end sm:items-center justify-center sm:p-4"><div class="bg-white w-full sm:max-w-md rounded-t-2xl sm:rounded-2xl max-h-[92vh] overflow-y-auto safe-b">${html}</div></div>`; $('#mb').onclick = (e) => { if (e.target.id === 'mb' && !sticky) closeModal(); }; }
const closeModal = () => { $('#modalHost').innerHTML = ''; };
const confirmM = (text, ok = 'Ja', danger) => new Promise(res => { modal(`<div class="p-5"><div class="font-semibold mb-4">${h(text)}</div><div class="grid grid-cols-2 gap-2"><button id="cN" class="btn py-3 rounded-lg border border-slate-300 font-semibold">Nee</button><button id="cY" class="btn py-3 rounded-lg text-white font-semibold ${danger ? 'bg-rose-600' : 'bg-slate-900'}">${h(ok)}</button></div></div>`, true); $('#cN').onclick = () => { closeModal(); res(false); }; $('#cY').onclick = () => { closeModal(); res(true); }; });
let ac = null;
function feedback(kind) {
  if (S().vibrate && navigator.vibrate) { try { navigator.vibrate(kind === 'done' ? [40, 60, 40] : 20); } catch (e) {} }
  if (!S().sound) return;
  try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = kind === 'done' ? 1250 : kind === 'key' ? 680 : 960; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.2, t + .005); g.gain.exponentialRampToValueAtTime(.0001, t + (kind === 'done' ? .25 : .06)); o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + .3); } catch (e) {}
}
const chip = (txt, cls) => `<span class="inline-block rounded-full px-2 py-0.5 text-xs font-semibold ${cls}">${txt}</span>`;
const scoreChip = (s) => s == null ? chip('–', 'bg-slate-100 text-slate-500') : chip(s, s >= 75 ? 'bg-emerald-100 text-emerald-800' : s >= 55 ? 'bg-amber-100 text-amber-800' : 'bg-rose-100 text-rose-800');

/* ================= ROUTER ================= */
const ROUTES = {}; let cur = { name: 'wheels', params: [] };
const nav = (p, rep) => { if (rep) location.replace('#/' + p); else location.hash = '/' + p; };
window.addEventListener('hashchange', render);
function render() {
  closeModal();
  const p = (location.hash || '#/wheels').replace(/^#\/?/, '').split('/').filter(Boolean); cur = { name: p[0] || 'wheels', params: p.slice(1) };
  const ctx = (ROUTES[cur.name] || ROUTES.wheels)(...cur.params); if (!ctx) return;
  $('#hdrTitle').textContent = ctx.title; $('#hdrSub').textContent = ctx.sub || '';
  const b = $('#hdrBack'); b.style.visibility = ctx.back ? 'visible' : 'hidden'; b.onclick = () => nav(ctx.back);
  $('#hdrRight').innerHTML = ctx.right || '';
  $('#tabBar').style.display = ctx.focus ? 'none' : '';
  $('#view').classList.remove('pb-24', 'pb-4', 'pb-52'); $('#view').classList.add(ctx.focus ? 'pb-4' : ctx.tall ? 'pb-52' : 'pb-24');
  const NAV = [['wheels', 'Wielen'], ['customers', 'Klanten'], ['settings', 'Instellingen']];
  const act = (n) => cur.name === n || (n === 'wheels' && ['new', 'measure', 'result', 'report'].includes(cur.name)) || (n === 'customers' && cur.name === 'customer');
  $('#tabBar').innerHTML = NAV.map(([n, l]) => `<a href="#/${n}" class="h-14 flex items-center justify-center text-sm font-semibold ${act(n) ? 'text-slate-900' : 'text-slate-400'}">${l}</a>`).join('');
  $('#sideNav').innerHTML = NAV.map(([n, l]) => `<a href="#/${n}" class="block px-3 py-2 rounded-lg text-sm font-semibold ${act(n) ? 'bg-slate-800 text-white' : 'text-slate-300'}">${l}</a>`).join('');
  $('#sideFoot').innerHTML = h(S().shop || '') + (S().lastSync ? `<div>Drive ${fmtDate(S().lastSync)} ${fmtTime(S().lastSync)}</div>` : '');
  window.scrollTo(0, 0);
}

/* ================= WIELEN ================= */
let q1 = '';
function wheelRow(w) {
  const c = getCustomer(w.customerId), m = lastM(w), open = m && !m.done, nul = nulM(w), eind = eindM(w);
  return `<a href="#/${open ? 'measure' : 'result'}/${w.id}" class="card p-3 flex items-center gap-3">
    <div class="flex-1 min-w-0"><div class="font-bold truncate">${h(c ? c.name : 'Zonder klant')}${c && c.bike ? ` <span class="font-normal text-slate-500">· ${h(c.bike)}</span>` : ''}</div>
      <div class="text-sm text-slate-500">${h(wheelLabel(w))}${w.label ? ' · ' + h(w.label) : ''} · ${fmtDate(w.updatedAt)}</div></div>
    ${open ? chip('bezig', 'bg-amber-100 text-amber-800') : eind ? chip('eind', 'bg-emerald-100 text-emerald-800') : nul ? chip('nul', 'bg-sky-100 text-sky-800') : ''}
    ${nul && eind && nul.id !== eind.id ? `<span class="text-xs text-slate-500">${analyze(nul, w).score}→</span>` : ''}${scoreChip(wheelScore(w))}<span class="text-slate-300">›</span></a>`;
}
ROUTES.wheels = () => {
  const q = q1.trim().toLowerCase();
  const list = wheels().filter(w => !q || [custName(w.customerId), (getCustomer(w.customerId) || {}).bike, (getCustomer(w.customerId) || {}).frame, w.label].some(v => (v || '').toLowerCase().includes(q))).sort((a, b) => b.updatedAt - a.updatedAt);
  $('#view').innerHTML = `<div class="flex gap-2 mb-3"><input id="q1" type="search" placeholder="Zoek" value="${h(q1)}"><a href="#/new" class="btn bg-slate-900 text-white rounded-lg px-5 flex items-center font-bold shrink-0">+ Wiel</a></div>
    ${list.length ? `<div class="grid gap-2 lg:grid-cols-2">${list.map(wheelRow).join('')}</div>` : '<div class="card p-8 text-center text-slate-400">Geen wielen</div>'}`;
  live('#q1', v => q1 = v, ROUTES.wheels);
  return { title: 'Wielen', sub: S().shop };
};
function live(id, set, re) { const el = $(id); if (!el) return; el.addEventListener('input', e => { set(e.target.value); const p = e.target.selectionStart; re(); const i = $(id); if (i) { i.focus(); try { i.setSelectionRange(p, p); } catch (x) {} } }); }

/* ================= NIEUW WIEL ================= */
let draft = { customer: '', type: 'rear', spokes: 32, spokeType: 'sapim_race', label: '' };
ROUTES.new = (cid) => {
  if (cid) { const c = getCustomer(cid); if (c) draft.customer = c.name; nav('new', true); return null; }
  const opt = (k, v, l) => `<button data-k="${k}" data-v="${v}" class="btn opt py-3 ${String(draft[k]) === String(v) ? 'on' : ''}">${l}</button>`;
  $('#view').innerHTML = `<div class="max-w-xl mx-auto space-y-4">
    <div><div class="text-xs font-bold text-slate-500 mb-1">KLANT</div><input id="nCust" type="text" list="custList" placeholder="Naam (leeg = zonder klant)" value="${h(draft.customer)}"><datalist id="custList">${customers().map(c => `<option value="${h(c.name)}">`).join('')}</datalist></div>
    <div><div class="text-xs font-bold text-slate-500 mb-1">WIEL</div><div class="grid grid-cols-2 gap-2">${opt('type', 'front', 'Voor')}${opt('type', 'rear', 'Achter')}</div></div>
    <div><div class="text-xs font-bold text-slate-500 mb-1">SPAKEN</div><div class="grid grid-cols-4 gap-2">${[24, 28, 32, 36].map(n => opt('spokes', n, n)).join('')}</div></div>
    <div><div class="text-xs font-bold text-slate-500 mb-1">SPAAK</div><button id="nSpoke" class="btn w-full card px-4 py-3 flex items-center justify-between text-left"><span><span class="font-bold">${h(SPOKE_TYPES[draft.spokeType].label)}</span><span class="block text-sm text-slate-500">${h(SPOKE_TYPES[draft.spokeType].sub)} mm</span></span><span class="text-slate-400 text-xl">▾</span></button></div>
    <input id="nLabel" type="text" placeholder="Omschrijving (optioneel)" value="${h(draft.label)}">
    <button id="nStart" class="btn w-full bg-slate-900 text-white rounded-lg py-4 text-lg font-bold">Start meting</button></div>`;
  $$('[data-k]').forEach(b => b.onclick = () => { draft[b.dataset.k] = b.dataset.k === 'spokes' ? +b.dataset.v : b.dataset.v; feedback('key'); render(); });
  $('#nSpoke').onclick = () => spokePicker(draft.spokeType, id => { draft.spokeType = id; render(); });
  $('#nCust').addEventListener('input', e => draft.customer = e.target.value);
  $('#nLabel').addEventListener('input', e => draft.label = e.target.value);
  $('#nStart').onclick = () => {
    const name = draft.customer.trim(); let cid = null;
    if (name) { let c = customers().find(c => c.name.toLowerCase() === name.toLowerCase()); if (!c) c = upsert(DB.customers, { id: uid('c'), name, phone: '', email: '', bike: '', frame: '', createdAt: now() }); cid = c.id; }
    const w = { id: uid('w'), customerId: cid, type: draft.type, spokes: draft.spokes, spokeType: draft.spokeType, label: draft.label.trim(), createdAt: now(), measurements: [] };
    w.measurements.push(newMeasurement(w, null, null, 'nul')); upsert(DB.wheels, w);
    DB.meta.active = { wheelId: w.id, mId: w.measurements[0].id, side: 'R', idx: 0 }; draft.customer = ''; draft.label = ''; save(true);
    nav('measure/' + w.id, true);
  };
  return { title: 'Nieuw wiel', back: 'wheels' };
};

function spokePicker(curId, done) {
  let q = '';
  const list = () => {
    const f = q.trim().toLowerCase();
    const items = Object.values(SPOKE_TYPES).filter((t, i, arr) => arr.indexOf(t) === i).filter(t => !f || (t.label + ' ' + t.sub).toLowerCase().includes(f));
    const groups = [...new Set(items.map(t => t.brand))];
    return groups.map(b => `<div class="text-[11px] font-bold text-slate-500 px-1 pt-2">${h(b).toUpperCase()}</div>` + items.filter(t => t.brand === b).map(t => `<button data-id="${t.id}" class="btn w-full flex items-center justify-between px-3 py-2.5 rounded-lg text-left ${t.id === curId ? 'bg-slate-900 text-white' : 'hover:bg-slate-100'}"><span class="font-semibold">${h(t.model)}</span><span class="text-sm ${t.id === curId ? 'opacity-80' : 'text-slate-500'}">${h(t.sub)}</span></button>`).join('')).join('') || '<div class="p-4 text-slate-400 text-sm">Niets gevonden</div>';
  };
  modal(`<div class="p-3"><input id="spQ" type="search" placeholder="Zoek merk, type of maat"><div id="spL" class="mt-2 max-h-[65vh] overflow-y-auto">${list()}</div></div>`);
  const bind = () => $$('#spL [data-id]').forEach(b => b.onclick = () => { closeModal(); done(b.dataset.id); });
  bind(); setTimeout(() => $('#spQ').focus(), 50);
  $('#spQ').addEventListener('input', e => { q = e.target.value; $('#spL').innerHTML = list(); bind(); });
}

/* ================= METEN ================= */
let pad = '', keyHandler = null;
function nextTodo(m, side, from) { const t = m.todo[side]; for (const i of t) if (i > from) return i; return t.length ? t[0] : -1; }
ROUTES.measure = (wid) => {
  const w = getWheel(wid); if (!w) { nav('wheels', true); return null; }
  let a = DB.meta.active; let m = a && a.wheelId === wid ? w.measurements.find(x => x.id === a.mId) : null;
  if (!m) { m = lastM(w); if (!m) { nav('wheels', true); return null; } a = DB.meta.active = { wheelId: wid, mId: m.id, side: 'R', idx: 0 }; }
  if (!m.todo.R.length && !m.todo.L.length) { m.done = true; upsert(DB.wheels, w); nav('result/' + wid, true); return null; }
  if (!m.todo[a.side].includes(a.idx)) { if (m.todo[a.side].length) a.idx = m.todo[a.side][0]; else { a.side = a.side === 'R' ? 'L' : 'R'; a.idx = m.todo[a.side][0]; } }
  const half = w.spokes / 2, c = getCustomer(w.customerId);
  $('#view').innerHTML = `<div class="lg:grid lg:grid-cols-5 lg:gap-5"><div class="lg:col-span-3" id="mp"></div><div class="hidden lg:block lg:col-span-2" id="lp"></div></div>`;
  const paint = () => {
    const s = a.side, i = a.idx, vals = m[s], curV = vals[i], an = analyze(m, w);
    let ref = null; for (let k = i - 1; k >= 0; k--) if (vals[k] != null) { ref = vals[k]; break; }
    if (ref == null) for (let k = vals.length - 1; k >= 0; k--) if (vals[k] != null) { ref = vals[k]; break; }
    if (ref == null) { const o = m[s === 'R' ? 'L' : 'R']; for (let k = o.length - 1; k >= 0; k--) if (o[k] != null) { ref = o[k]; break; } }
    const quick = ref == null ? [] : [ref - 2, ref - 1, ref, ref + 1, ref + 2].filter(v => v >= MIN_READ && v <= MAX_READ);
    const prog = (side) => `${half - m.todo[side].length}/${half}`;
    $('#mp').innerHTML = `
      <div class="grid grid-cols-2 gap-2 mb-3">${['R', 'L'].map(side => `<button data-side="${side}" class="btn rounded-lg py-3 font-bold text-white ${side === s ? '' : 'opacity-40'}" style="background:${COL[side]}">${side === 'R' ? 'Rechts' : 'Links'} <span class="font-normal text-sm">${prog(side)}</span></button>`).join('')}</div>
      <div class="rounded-xl p-4 text-white mb-3 flex items-center justify-between" style="background:${COL[s]}">
        <div class="text-5xl font-extrabold">${s}${i + 1}</div>
        <div class="text-right text-sm opacity-90">${curV != null ? `nu ${curV}` : ''}${m.partial ? '<div>nameten</div>' : ''}</div></div>
      <div class="grid grid-cols-8 gap-1 mb-3">${vals.map((v, k) => `<button data-i="${k}" class="btn rounded-md py-1.5 text-center ${k === i ? 'ring-2 ring-slate-900' : ''} ${v == null ? 'bg-white border border-slate-200 text-slate-300' : m.todo[s].includes(k) ? 'bg-amber-100' : 'bg-white border border-slate-200'}"><div class="text-[9px] text-slate-400">${k + 1}</div><div class="font-bold text-sm">${v ?? '·'}</div></button>`).join('')}</div>
      ${quick.length ? `<div class="grid grid-cols-5 gap-2 mb-3">${quick.map(v => `<button data-q="${v}" class="btn rounded-lg py-3.5 text-2xl font-extrabold border ${v === ref ? 'bg-slate-900 text-white border-slate-900' : 'bg-white border-slate-200'}">${v}</button>`).join('')}</div>` : ''}
      <div class="card p-2.5 mb-3"><div class="text-right text-4xl font-extrabold tabular-nums px-2 mb-2 min-h-[2.5rem]" id="padD">${pad || '–'}</div>
        <div class="grid grid-cols-3 gap-2">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(k => `<button data-key="${k}" class="btn key">${k}</button>`).join('')}<button data-key="del" class="btn key !bg-slate-200">⌫</button><button data-key="0" class="btn key">0</button><button data-key="ok" class="btn key !bg-emerald-600 !text-white">OK</button></div></div>
      <div class="grid grid-cols-2 gap-2"><button id="mPrev" class="btn bg-white border border-slate-200 rounded-lg py-3 font-bold">‹ Vorige</button><button id="mDone" class="btn bg-slate-900 text-white rounded-lg py-3 font-bold">Resultaat</button></div>`;
    $('#lp').innerHTML = `<div class="card p-3 sticky top-16">${radialChart(an, w, 320)}<div class="grid grid-cols-2 gap-2 mt-2 text-sm">${['R', 'L'].map(side => `<div class="rounded-lg p-2 text-white" style="background:${COL[side]}">${side === 'R' ? 'Rechts' : 'Links'} <b>${an.sides[side].avgR != null ? an.sides[side].avgR.toFixed(1) : '–'}</b></div>`).join('')}</div></div>`;
    $$('[data-side]').forEach(b => b.onclick = () => { a.side = b.dataset.side; a.idx = m.todo[a.side].length ? m.todo[a.side][0] : 0; pad = ''; save(); paint(); });
    $$('[data-i]').forEach(b => b.onclick = () => { a.idx = +b.dataset.i; pad = ''; save(); paint(); });
    $$('[data-q]').forEach(b => b.onclick = () => commit(+b.dataset.q));
    $$('[data-key]').forEach(b => b.onclick = () => key(b.dataset.key));
    $('#mPrev').onclick = () => { a.idx = (i - 1 + half) % half; pad = ''; feedback('key'); save(); paint(); };
    $('#mDone').onclick = async () => { const left = m.todo.R.length + m.todo.L.length; if (left && !(await confirmM(`Nog ${left} spaken open. Toch resultaat?`, 'Ja'))) return; m.updatedAt = now(); upsert(DB.wheels, w); nav('result/' + wid); };
  };
  const commit = (v) => {
    if (!(v >= MIN_READ && v <= MAX_READ)) { pad = ''; paint(); return; }
    const s = a.side, i = a.idx; m[s][i] = v; m.todo[s] = m.todo[s].filter(x => x !== i); m.updatedAt = now(); pad = '';
    let nx = nextTodo(m, s, i);
    if (nx === -1) { const o = s === 'R' ? 'L' : 'R'; if (m.todo[o].length) { a.side = o; nx = m.todo[o][0]; feedback('done'); } }
    if (nx === -1) { m.done = true; upsert(DB.wheels, w); save(true); feedback('done'); if (S().autoSync && Drive.hasToken()) Drive.sync(true); setTimeout(() => nav('result/' + wid, true), 200); return; }
    a.idx = nx; upsert(DB.wheels, w); feedback('ok'); $('#padD').textContent = v; setTimeout(paint, 100);
  };
  const key = (k) => {
    if (k === 'del') { pad = pad.slice(0, -1); $('#padD').textContent = pad || '–'; return; }
    if (k === 'ok') { if (pad) commit(+pad); return; }
    if (pad.length >= 2) pad = ''; pad += k; $('#padD').textContent = pad;
    if (pad.length === 2) { const v = +pad; if (v >= MIN_READ) setTimeout(() => commit(v), 100); else { pad = ''; $('#padD').textContent = '–'; } } else feedback('key');
  };
  keyHandler = (e) => { if (/input/i.test(e.target.tagName)) return; if (/^[0-9]$/.test(e.key)) key(e.key); else if (e.key === 'Enter') key('ok'); else if (e.key === 'Backspace') key('del'); else if (e.key === 'ArrowLeft') $('#mPrev').click(); else return; e.preventDefault(); };
  paint();
  return { title: PHASE[m.phase], sub: (c ? c.name + ' · ' : '') + wheelLabel(w), back: 'wheels', focus: true, right: `<a href="#/result/${wid}" class="btn text-sm font-semibold px-3 py-2">Stop</a>` };
};
document.addEventListener('keydown', e => { if (cur.name === 'measure' && keyHandler) keyHandler(e); });

/* ================= RESULTAAT ================= */
ROUTES.result = (wid, mid) => {
  const w = getWheel(wid); if (!w) { nav('wheels', true); return null; }
  const m = (mid && w.measurements.find(x => x.id === mid)) || lastM(w); if (!m) { nav('wheels', true); return null; }
  const an = analyze(m, w), inf = scoreInfo(an.score), c = getCustomer(w.customerId), nul = nulM(w);
  const nulScore = nul && nul.id !== m.id ? analyze(nul, w).score : null, nAct = an.actions.length;
  const sideBlock = (s) => { const sd = an.sides[s]; return `<div class="card overflow-hidden">
    <div class="px-3 py-2 text-white flex items-center justify-between" style="background:${COL[s]}"><b>${s === 'R' ? 'Rechts' : 'Links'}</b><span class="text-sm">${sd.avg != null ? `${Math.round(sd.avg)} kgf${an.cal ? '' : '*'} · stand ${sd.avgR.toFixed(1)} · ±${Math.round(sd.maxDev)} %` : '–'}</span></div>
    <div class="p-2 space-y-1">${sd.actions.length ? sd.actions.map(x => `<button data-e="${s}${x.i}" class="btn w-full flex items-center gap-3 rounded-lg px-3 py-2.5 text-left ${x.urgent ? 'bg-rose-50' : 'bg-amber-50'}"><span class="w-12 font-extrabold text-lg">${s}${x.no}</span><span class="flex-1 font-bold">${x.turn} slag ${x.dir.toUpperCase()}</span><span class="text-xs text-slate-500">${x.dev > 0 ? '+' : ''}${Math.round(x.dev)} %</span></button>`).join('') : '<div class="px-3 py-2 text-sm text-emerald-700 font-semibold">Alles binnen tolerantie</div>'}</div>
    <div class="px-2 pb-2 grid grid-cols-8 gap-1">${sd.spokes.map(x => `<button data-e="${s}${x.i}" class="btn rounded-md py-1 ${devCls(x.dev)}"><div class="text-[9px] text-slate-500">${x.no}</div><div class="font-bold text-sm">${x.r ?? '·'}</div></button>`).join('')}</div></div>`; };
  const hist = w.measurements.filter(x => x.done);
  $('#view').innerHTML = `<div class="lg:grid lg:grid-cols-5 lg:gap-5"><div class="lg:col-span-3 space-y-3">
      ${hist.length > 1 ? `<div class="flex gap-2 overflow-x-auto">${hist.map((x, k) => `<a href="#/result/${wid}/${x.id}" class="shrink-0 rounded-lg px-3 py-1.5 text-xs font-semibold border ${x.id === m.id ? 'bg-slate-900 text-white border-slate-900' : 'bg-white border-slate-200'}">${k + 1}. ${PHASE[x.phase]} ${analyze(x, w).score}</a>`).join('')}</div>` : ''}
      <div class="card p-3 flex items-center gap-4">${ring(an.score, 84, 9)}<div class="flex-1"><div class="text-xs font-bold text-slate-500">${PHASE[m.phase].toUpperCase()} · ${fmtDate(m.updatedAt)}</div><div class="text-xl font-extrabold ${inf.cls}">${inf.label}</div><div class="text-sm text-slate-600">${an.within}/${an.n} binnen ±${TOL_OK} %${nulScore != null ? ` · nul ${nulScore} → ${an.score}` : ''}</div><div class="mt-1.5 h-2 rounded-full bg-slate-200 overflow-hidden"><div class="scorebar h-full" style="width:${an.score}%"></div></div></div></div>
      ${!an.complete ? `<a href="#/measure/${wid}" class="block rounded-lg bg-amber-100 p-3 text-sm font-semibold">Nog niet alles gemeten · verder meten</a>` : ''}
      ${sideBlock('R')}${sideBlock('L')}</div>
    <div class="lg:col-span-2 space-y-3 mt-3 lg:mt-0"><div class="card p-3 hidden lg:block" id="acts"></div><div class="card p-3">${radialChart(an, w, 360)}</div>
      <button id="del" class="hidden lg:block w-full py-2 text-sm font-semibold text-rose-600">Wiel verwijderen</button></div></div>
    <div id="bar" class="lg:hidden fixed inset-x-0 z-20 bg-white border-t border-slate-200 p-2" style="bottom:calc(3.5rem + env(safe-area-inset-bottom))"></div>`;
  const acts = (v) => `<div class="${v ? 'space-y-2' : 'grid grid-cols-2 gap-2'}">
    ${nAct ? `<button data-a="re" class="btn w-full bg-slate-900 text-white rounded-lg py-3 font-bold">Nameten (${nAct})</button>` : ''}
    ${an.complete && m.phase !== 'eind' ? `<button data-a="fin" class="btn w-full ${nAct ? 'bg-white border border-slate-300' : 'bg-emerald-600 text-white'} rounded-lg py-3 font-bold">Eindmeting</button>` : ''}
    <a href="#/report/${wid}" class="btn w-full flex items-center justify-center bg-white border border-slate-300 rounded-lg py-3 font-bold ${!nAct && m.phase === 'eind' ? 'col-span-2' : ''}">Certificaat</a>
    <button data-a="all" class="btn w-full py-2 text-sm font-semibold text-slate-500 ${v ? '' : 'col-span-2'}">Alles opnieuw</button></div>`;
  $('#acts').innerHTML = acts(true); $('#bar').innerHTML = acts(false);
  const start = (only) => { const nm = newMeasurement(w, m, only, 'tussen'); w.measurements.push(nm); DB.meta.active = { wheelId: wid, mId: nm.id, side: nm.todo.R.length ? 'R' : 'L', idx: 0 }; upsert(DB.wheels, w); pad = ''; nav('measure/' + wid); };
  $$('[data-a="re"]').forEach(b => b.onclick = () => start({ R: an.sides.R.actions.map(x => x.i), L: an.sides.L.actions.map(x => x.i) }));
  $$('[data-a="all"]').forEach(b => b.onclick = () => start(null));
  $$('[data-a="fin"]').forEach(b => b.onclick = async () => { if (nAct && !(await confirmM(`${nAct} spaken buiten tolerantie. Toch eindmeting?`))) return; w.measurements.forEach(x => { if (x.phase === 'eind') x.phase = 'tussen'; }); m.phase = 'eind'; m.updatedAt = now(); upsert(DB.wheels, w); save(true); feedback('done'); if (S().autoSync && Drive.hasToken()) Drive.sync(true); render(); });
  $('#del').onclick = async () => { if (await confirmM('Wiel verwijderen?', 'Verwijder', true)) { remove(DB.wheels, wid); nav('wheels'); } };
  $$('[data-e]').forEach(b => b.onclick = () => editSpoke(w, m, b.dataset.e[0], +b.dataset.e.slice(1)));
  return { title: 'Resultaat', sub: (c ? c.name + ' · ' : '') + wheelLabel(w), back: 'wheels', tall: true, right: `<a href="#/report/${wid}" class="btn text-sm font-semibold px-3 py-2">Certificaat</a><button id="delM" class="btn lg:hidden text-sm font-semibold px-2 py-2 text-rose-600">✕</button>` };
};
document.addEventListener('click', async e => { if (e.target.id === 'delM') { const wid = cur.params[0]; if (await confirmM('Wiel verwijderen?', 'Verwijder', true)) { remove(DB.wheels, wid); nav('wheels'); } } });
function editSpoke(w, m, s, i) {

const exportData = () => ({ v: 3, exportedAt: now(), customers: DB.customers, wheels: DB.wheels });

  ml(DB.customers, rem.customers, () => nc++); ml(DB.wheels, rem.wheels, () => nw++); return { customers: nc, wheels: nw };
}
const Drive = {
  token: null, exp: 0, fileId: null, syncing: false,
  hasToken() { return !!this.token && now() < this.exp; },
  loadGis() { return new Promise((res, rej) => { if (window.google && google.accounts && google.accounts.oauth2) return res(); if (!document.getElementById('gis')) { const sc = document.createElement('script'); sc.id = 'gis'; sc.src = 'https://accounts.google.com/gsi/client'; sc.async = true; document.head.appendChild(sc); } const t0 = now(), iv = setInterval(() => { if (window.google && google.accounts && google.accounts.oauth2) { clearInterval(iv); res(); } else if (now() - t0 > 10000) { clearInterval(iv); rej(new Error('Google-script niet geladen')); } }, 100); }); },
  async getToken(inter) {
    if (this.hasToken()) return this.token; if (!S().driveClientId) throw new Error('geen Client ID'); await this.loadGis();
    return new Promise((res, rej) => { const cl = google.accounts.oauth2.initTokenClient({ client_id: S().driveClientId, scope: DRIVE_SCOPE, callback: r => { if (r.error) rej(new Error(r.error_description || r.error)); else { this.token = r.access_token; this.exp = now() + ((r.expires_in || 3600) - 60) * 1000; res(this.token); } }, error_callback: e => rej(new Error(e && e.type ? e.type : 'geannuleerd')) }); cl.requestAccessToken({ prompt: inter ? 'consent' : '' }); });
  },
  async connect() { this.token = null; return this.getToken(true); },
  async api(url, o = {}) { const t = await this.getToken(false); const r = await fetch(url, Object.assign({}, o, { headers: Object.assign({ Authorization: 'Bearer ' + t }, o.headers || {}) })); if (r.status === 401) { this.token = null; throw new Error('sessie verlopen'); } if (!r.ok) throw new Error('Drive ' + r.status); return r; },
  async find() { if (this.fileId) return this.fileId; const r = await this.api(`https://www.googleapis.com/drive/v3/files?spaces=drive&q=${encodeURIComponent(`name='${DRIVE_FILE}' and trashed=false`)}&fields=files(id)`); const d = await r.json(); this.fileId = d.files && d.files[0] ? d.files[0].id : null; return this.fileId; },
  async pull() { const id = await this.find(); if (!id) return null; return (await this.api(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`)).json(); },
  async push(data) {
    const id = await this.find(), body = JSON.stringify(data);
    if (id) { await this.api(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body }); return; }
    const b = 'spk' + now().toString(36), mp = `--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify({ name: DRIVE_FILE, mimeType: 'application/json' })}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${b}--`;
    const r = await this.api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', { method: 'POST', headers: { 'Content-Type': `multipart/related; boundary=${b}` }, body: mp }); this.fileId = (await r.json()).id;
  },
  async sync(silent) { if (this.syncing) return { customers: 0, wheels: 0 }; this.syncing = true; try { const rem = await this.pull(); const r = rem ? mergeInto(rem) : { customers: 0, wheels: 0 }; await this.push(exportData()); S().lastSync = now(); save(true); return r; } catch (e) { if (!silent) throw e; return { customers: 0, wheels: 0, error: e.message }; } finally { this.syncing = false; } },
};

/* ================= INIT ================= */
if (!location.hash) nav('wheels', true);
render();
if (S().autoSync && S().driveClientId) Drive.sync(true).then(r => { if (!r.error && (r.customers || r.wheels)) { toast('Drive bijgewerkt'); render(); } });
</script>
