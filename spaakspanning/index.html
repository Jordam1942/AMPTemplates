/* ================= WIEL VLECHTEN (vlecht-wizard) =================
   Klassieke 4-groepenmethode. Posities zoals overal in de app: velggaten 0..n-1 met de klok mee vanaf het ventiel, van rechts gezien.
   Groep 1: rechts, kop buiten, met de sleutelspaak in het rechts geboorde gat naast het ventiel; elk 2e naafgat, elk 4e velggat.
   Groep 2: links, kop buiten; de parallelle spaak in het gat aan de andere kant van het ventiel (pompkop past ertussen).
   Torderen: naaf tegen de rijrichting in, groep 1 en 2 worden duwend. Groep 3 (rechts) en 4 (links): kop binnen, trekkend, kruisen.

  const ms = wheels().flatMap(w => (w.trashM || []).map(m => ({ w, m }))).sort((a, b) => b.m.deletedAt - a.m.deletedAt);
  if (ms.length) groups.push([t('trash_k_meas'), ms.map(({ w, m }) => row(wName(w), phaseLbl(m.phase), m.deletedAt, `data-rm="${w.id}|${m.id}"`))]);
  const seen = new Set(); for (const [k, lbl] of TRASH_KINDS) { const rs = (DB[k] || []).filter(r => r && r.deleted && !r.purged).sort((a, b) => b.deletedAt - a.deletedAt); if (!rs.length) continue;
    const html = rs.map(r => row(nm(k, r), '', r.deletedAt || r.updatedAt, `data-rr="${k}|${r.id}"`)); const g = groups.find(x => x[0] === t(lbl)); if (g) g[1].push(...html); else groups.push([t(lbl), html]); seen.add(k); }
  $('#view').innerHTML = `<div class="max-w-xl mx-auto space-y-3"><div class="text-sm text-slate-600">${t('trash_info', { n: TRASH_DAYS })}</div>
    ${groups.length ? groups.map(([g, rows]) => `<div class="space-y-1.5"><div class="text-[11px] font-bold uppercase tracking-wide text-slate-500 px-1">${h(g)}</div>${rows.join('')}</div>`).join('')
      + `<button id="trEmpty" class="btn w-full py-3 rounded-lg border border-rose-300 text-rose-700 font-bold">${t('trash_purge')}</button>`
      : `<div class="card p-8 text-center text-slate-400">${t('trash_empty')}</div>`}</div>`;
  $$('[data-rr]').forEach(b => b.onclick = () => { const [k, id] = b.dataset.rr.split('|'); restoreRec(k, id); save(true); toast(t('trash_restored')); render(); });
  $$('[data-rm]').forEach(b => b.onclick = () => { const [wid, mid] = b.dataset.rm.split('|'); const w = getWheel(wid); if (w) restoreMeasurement(w, mid); save(true); toast(t('trash_restored')); render(); });
  if ($('#trEmpty')) $('#trEmpty').onclick = async () => { if (await confirmM(t('trash_purge_q'), t('trash_purge'), true)) { purgeTrash(true); save(true); render(); } };
  return { title: t('trash_title'), back: 'wheels' };
};

/* ================= SYNC ================= */
const exportData = () => ({ v: 3, exportedAt: now(), customers: DB.customers, wheels: DB.wheels, calcs: DB.calcs || [], hubs: DB.hubs || [], rims: DB.rims || [], tpls: DB.tpls || [] });
function mergeInto(rem) {
  let nc = 0, nw = 0; const ml = (loc, inc, cb) => { for (const r of inc || []) { if (!r || !r.id) continue; const i = loc.findIndex(x => x.id === r.id); if (i < 0) { loc.push(r); cb(); } else if ((r.updatedAt || 0) > (loc[i].updatedAt || 0)) { loc[i] = r; cb(); } } };
  ml(DB.customers, rem.customers, () => nc++); ml(DB.wheels, rem.wheels, () => nw++); ml(DB.calcs = DB.calcs || [], rem.calcs, () => {}); ml(DB.hubs = DB.hubs || [], rem.hubs, () => {}); ml(DB.rims = DB.rims || [], rem.rims, () => {}); ml(DB.tpls = DB.tpls || [], rem.tpls, () => {}); return { customers: nc, wheels: nw };
}
/* ================= OPSLAG & BACK-UP =================
   Primair: alles staat direct in de browser (localStorage) en wordt gespiegeld naar IndexedDB; de browser wordt gevraagd
   die opslag blijvend te houden. Is localStorage leeg of kapot, dan komt alles terug uit IndexedDB.
   Back-up: één tik downloaden of delen (deelmenu: WhatsApp, Drive, Bestanden). Geen mapkoppeling of achtergrond-sync meer. */
const idb = {
  open() { return new Promise((res, rej) => { const r = indexedDB.open('spaakspanning', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async get(k) { try { const d = await this.open(); return await new Promise(res => { const q = d.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); }); } catch (e) { return null; } },
  async set(k, v) { try { const d = await this.open(); await new Promise(res => { const tx = d.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = res; tx.onerror = res; }); } catch (e) {} },
};
let idbT = null; const mirrorIdb = () => { clearTimeout(idbT); idbT = setTimeout(() => idb.set('db', JSON.stringify(DB)), 800); };
async function initStorage() {
  try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch (e) {}
  if (!wheels().length && !customers().length) { const raw = await idb.get('db'); try { const d = raw ? JSON.parse(raw) : null; if (d && d.v === 3 && ((d.wheels || []).length || (d.customers || []).length)) { DB = Object.assign(emptyDB(), d, { settings: Object.assign(defSettings(), d.settings || {}) }); saveLocal(); toast(t('st_restored')); render(); } } catch (e) {} }
  else mirrorIdb();
}
const BK_KEYS = ['shop', 'mechanic', 'meter', 'calib', 'unit', 'defMax', 'tol', 'lang', 'reportLang', 'expl', 'student', 'sound', 'vibrate'];
const backupData = () => Object.assign({ app: 'spaakspanning' }, exportData(), { settings: Object.fromEntries(BK_KEYS.filter(k => S()[k] !== undefined).map(k => [k, S()[k]])) });
const backupBlob = () => new Blob([JSON.stringify(backupData())], { type: 'application/json' });
const backupDated = () => `spaakspanning-backup-${new Date().toISOString().slice(0, 10)}.json`;
const Backup = {
  canShare() { try { return !!(navigator.canShare && navigator.canShare({ files: [new File(['{}'], 'x.json', { type: 'application/json' })] })); } catch (e) { return false; } },
  done() { S().lastBackup = now(); saveLocal(); render(); },
  download() { const a = document.createElement('a'); a.href = URL.createObjectURL(backupBlob()); a.download = backupDated(); document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000); toast(t('bk_saved')); this.done(); },
  async share() { const f = new File([backupBlob()], backupDated(), { type: 'application/json' });
    try { await navigator.share({ files: [f], title: 'Spaakspanning back-up' }); this.done(); } catch (e) { if (!e || e.name !== 'AbortError') this.download(); } },
};
// Statusregel + twee grote knoppen; zelfde blok op het startscherm en in Instellingen
function backupCard() {
  const ls = S().lastBackup, days = ls ? Math.floor((Date.now() - ls) / DAY) : null, changed = (S().lastChange || 0) > (ls || 0);
  const today = ls && new Date(ls).toDateString() === new Date().toDateString(), yest = ls && new Date(ls).toDateString() === new Date(Date.now() - DAY).toDateString();
  const warn = !ls ? changed || wheels().length > 0 : changed && days >= 2;
  const txt = !ls ? t('bk_never_t') : today ? t('bk_today', { t: fmtTime(ls) }) : yest ? t('bk_yest', { t: fmtTime(ls) }) : warn ? t('bk_days', { n: days }) : t('bk_on_date', { d: fmtDate(ls) });
  return `<div class="card p-3 space-y-2 ${warn ? 'border-amber-300' : ''}"><div class="text-sm font-bold ${warn ? 'text-amber-900' : 'text-emerald-800'}">${warn ? '⚠ ' : '✓ '}${h(txt)}</div>
    <div class="grid ${Backup.canShare() ? 'grid-cols-2' : 'grid-cols-1'} gap-2"><button data-bkdl class="btn bg-slate-900 text-white rounded-lg py-3 font-bold">${t('bk_dl')}</button>${Backup.canShare() ? `<button data-bksh class="btn bg-white border border-slate-300 rounded-lg py-3 font-bold">${t('bk_share')}</button>` : ''}</div></div>`;
}
document.addEventListener('click', e => { const lf = e.target.closest && e.target.closest('[data-lfree], #tabBar a[href="#/lace"], #sideNav a[href="#/lace"]'); if (lf && DB.meta.lace && DB.meta.lace.fromCalc) { DB.meta.lace = null; save(); if (location.hash === '#/lace') setTimeout(render, 0); } });
document.addEventListener('click', e => { const t0 = e.target.closest && e.target; if (!t0) return; if (t0.closest('[data-bkdl]')) { e.preventDefault(); Backup.download(); } else if (t0.closest('[data-bksh]')) { e.preventDefault(); Backup.share(); } });
// Herstel: bestand kiezen, bevestigen, alles (ook de prullenbak) vervangen; vorige stand blijft bewaard voor 'Ongedaan maken'
async function restoreBackup(file) {
  let d; try { d = JSON.parse(await file.text()); } catch (e) { toast(t('t_invalid'), true); return; }
  if (!d || !Array.isArray(d.wheels) || !Array.isArray(d.customers)) { toast(t('t_invalid'), true); return; }
  if (!(await confirmM(t('bk_restore_q', { d: d.exportedAt ? fmtDate(d.exportedAt) + ' ' + fmtTime(d.exportedAt) : '?', w: d.wheels.filter(x => x && !x.deleted).length }), t('bk_restore')))) return;
  const prev = JSON.stringify(DB); try { localStorage.setItem(LS_KEY + '_voor_herstel', prev); } catch (e) {}
  for (const k of ['customers', 'wheels', 'calcs', 'hubs', 'rims', 'tpls']) DB[k] = Array.isArray(d[k]) ? d[k] : [];
  if (d.settings) for (const k of BK_KEYS) if (d.settings[k] !== undefined) S()[k] = d.settings[k];
  DB.meta.active = null; DB.meta.round = null; S().lastChange = now(); seedCatalog(); purgeTrash(); save(true); nav('wheels');
  undoToast(t('bk_restored'), () => { DB = JSON.parse(prev); });
}

/* ================= INIT ================= */
document.documentElement.lang = lang();
if (!location.hash) nav('wheels', true);
seedCatalog(); save(true);
render();
purgeTrash(); saveLocal();
initStorage();
</script>
